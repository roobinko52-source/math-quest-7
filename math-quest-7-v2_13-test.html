<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quest 7 – نسخه آزمایشی ۲.۱۳ | ماجراجویی در سرزمین ریاضی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --secondary: #0ea5e9;
      --accent: #f59e0b;
      --success: #10b981;
      --success-bg: #d1fae5;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #fefce8 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.65;
      overflow-x: hidden;
    }
    /* ایزوله‌سازی کامل اعداد علامت‌دار، قرینه‌ها و عبارت‌های ریاضی */
    .math, .num-ltr {
      direction: ltr !important;
      unicode-bidi: isolate;
      text-align: left !important;
      display: inline-block;
      font-weight: 800;
      background: rgba(79, 70, 229, 0.08);
      padding: 1px 8px;
      border-radius: 7px;
      color: #1e1b4b;
      margin: 0 3px;
      letter-spacing: 0.2px;
    }
    /* قرارداد قطعی نمایش ریاضی: هر عبارت، مستقل از متن فارسی اطراف، چپ‌به‌راست است. */
    bdi.math, .math, .num-ltr, [data-math="ltr"] {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      text-align: left !important;
      writing-mode: horizontal-tb !important;
    }
    /* قاعده سراسری و غیرقابل‌ارث‌بری برای همه عبارت‌های ریاضی */
    .math, .num-ltr, bdi.math, [data-math="ltr"], .math-run {
      direction: ltr !important;
      unicode-bidi: isolate-override !important;
      text-align: left !important;
      writing-mode: horizontal-tb !important;
      white-space: nowrap !important;
      display: inline-block !important;
      flex-direction: row !important;
    }
    .axis-step-badge { direction:ltr !important; unicode-bidi:isolate-override !important; text-align:left !important; display:inline-block; }
    .visual-card svg { direction: ltr !important; }
    .visual-card svg text { unicode-bidi: bidi-override; direction:ltr; }
    .visual-card svg .axis-fa { direction:rtl; unicode-bidi:isolate; }
    .visual-card svg .axis-number { direction:ltr; unicode-bidi:bidi-override; }
    /* ایزوله‌سازی سراسری عبارت‌های ریاضی؛ ترتیب علامت و عدد همیشه چپ‌به‌راست است. */
    .visual-card .math,
    .visual-card .num-ltr,
    .signed-columns,
    .signed-columns table,
    .signed-columns td,
    .signed-columns th {
      direction: ltr !important;
      unicode-bidi: isolate;
      text-align: left !important;
    }
    .signed-columns .fa-label { direction: rtl; unicode-bidi: isolate; text-align: right; }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.28); }
      50% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
    }
    @keyframes popBounce {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes drawArc {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    .anim-float { animation: floatSlow 3.4s ease-in-out infinite; }
    .anim-pulse { animation: pulseGlow 2.4s infinite; }
    .anim-pop { animation: popBounce 0.38s ease-out; }
    .arc-animated {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: drawArc 0.85s ease-out forwards;
    }

    .floating-math-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.14;
    }
    .float-symbol {
      position: absolute;
      font-size: 1.6rem;
      font-weight: 900;
      color: #4338ca;
      direction: ltr;
      animation: floatSlow 5s ease-in-out infinite;
    }

    header.topbar {
      background: linear-gradient(90deg, #312e81, #4338ca, #0369a1);
      color: #fff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 18px rgba(30, 27, 75, 0.25);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #1e1b4b;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .brand h1 { margin: 0; font-size: 1.12rem; font-weight: 900; }
    .brand small { display: block; font-size: 0.76rem; color: #c7d2fe; }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .stat-pill {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.24);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill button {
      background: rgba(255,255,255,0.22);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 700;
    }
    .stat-pill button:hover { background: rgba(255,255,255,0.36); }
    .container {
      max-width: 1240px;
      margin: 20px auto;
      padding: 0 16px 60px;
      position: relative;
      z-index: 1;
    }
    .mascot-banner {
      background: #fff;
      border: 2px solid #c7d2fe;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .mascot-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0e7ff, #bae6fd);
      display: grid;
      place-items: center;
      font-size: 30px;
      flex-shrink: 0;
      border: 2px solid var(--primary);
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .menu-card {
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .menu-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }
    .menu-icon {
      font-size: 1.9rem;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
    }
    .menu-card h3 { margin: 2px 0 0; font-size: 1.04rem; font-weight: 800; }
    .menu-card p { margin: 0; font-size: 0.86rem; color: var(--muted); }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
    }
    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
    }
    .section-header h2 { margin: 0; font-size: 1.25rem; color: var(--primary-dark); }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: var(--secondary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--accent); color: #1e1b4b; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; border-radius: 9px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    label.field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    select, input[type="text"], input[type="number"], input[type="password"], textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--border);
      font-size: 0.92rem;
      background: #fff;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .badge-easy { background: #dcfce7; color: #166534; }
    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-hard { background: #fee2e2; color: #991b1b; }
    .badge-ch { background: #e0e7ff; color: #3730a3; }
    .progress-wrap {
      background: #e2e8f0;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }
    .options-list {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }
    .option-btn {
      text-align: right;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.15s;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #eef2ff; }
    .option-btn.selected { border-color: var(--primary); background: #e0e7ff; }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #065f46; }
    .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #991b1b; }
    .opt-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid currentColor;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
      border-right: 5px solid var(--primary);
      background: #f8fafc;
    }
    .feedback-box.ok { border-right-color: var(--success); background: #ecfdf5; }
    .feedback-box.err { border-right-color: var(--danger); background: #fef2f2; }
    .visual-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      text-align: center;
    }
    .visual-card svg {
      max-width: 100%;
      height: auto;
      direction: ltr;
    }
    .axis-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .axis-step-badge {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      text-align: left !important;
      display: inline-block;
      background: #e0e7ff;
      color: #312e81;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .realms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .realm-card {
      border-radius: 18px;
      padding: 20px;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .realm-1 { background: linear-gradient(135deg, #0f766e, #0ea5e9); }
    .realm-2 { background: linear-gradient(135deg, #1d4ed8, #0284c7); }
    .realm-3 { background: linear-gradient(135deg, #6d28d9, #db2777); }
    .stage-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .stage-item {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: right;
    }
    table.data-table th { background: #f1f5f9; font-weight: 800; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .medal {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
    }
    .medal.locked {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #94a3b8;
    }
    /* استایل‌های جذاب و رنگارنگ بازی‌های استراحت و بازی‌وارسازی */
    .mini-game-arena {
      background: linear-gradient(135deg, #fff1f2 0%, #fefce8 35%, #ecfdf5 70%, #eff6ff 100%);
      border: 3px solid #a5b4fc;
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 14px 30px -8px rgba(79, 70, 229, 0.18);
      position: relative;
      overflow: hidden;
    }
    .game-hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .hud-chip {
      background: #fff;
      border: 2px solid #c7d2fe;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.86rem;
      color: #1e1b4b;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    }
    .game-stage-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .g-stage-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 2px solid #cbd5e1;
      background: #fff;
      font-weight: 800;
      font-size: 0.83rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .g-stage-btn.active {
      background: linear-gradient(90deg, #f59e0b, #ec4899);
      color: #fff;
      border-color: transparent;
      transform: scale(1.05);
    }
    .g-stage-btn.done {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
    }
    .rainbow-btn {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(236, 72, 153, 0.25);
      transition: transform 0.15s;
    }
    .rainbow-btn:hover { transform: translateY(-2px) scale(1.03); }

    /* آواتار و پروفایل دانش‌آموز */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .avatar-choice {
      font-size: 2rem;
      padding: 10px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      text-align: center;
      transition: 0.16s;
    }
    .avatar-choice:hover { transform: scale(1.08); border-color: var(--primary); }
    .avatar-choice.selected {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fef3c7, #e0e7ff);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transform: scale(1.08);
    }
    .profile-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      margin-bottom: 10px;
    }
    .profile-card-item.active-prof {
      border-color: var(--primary);
      background: #eef2ff;
    }
    .score-board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
    .player-card {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
    }
    .player-card.active-turn {
      border-color: var(--primary);
      background: #eef2ff;
    }
    @media print {
      header.topbar, .mascot-banner, .floating-math-bg, .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #999; }
    }
  .math{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;text-align:left}
</style>
</head>
<body>

<div class="floating-math-bg" aria-hidden="true">
  <div class="float-symbol" style="top:10%; right:6%; animation-delay:0s;">-۷</div>
  <div class="float-symbol" style="top:24%; left:8%; animation-delay:0.8s;">۲x + ۳</div>
  <div class="float-symbol" style="top:52%; right:4%; animation-delay:1.5s;">-۱۲ ÷ (-۴) = +۳</div>
  <div class="float-symbol" style="top:74%; left:10%; animation-delay:2.1s;">۴a</div>
  <div class="float-symbol" style="top:38%; left:45%; animation-delay:1.1s;">-(+(-۷)) = +۷</div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="navigate('home')">
      <div class="brand-logo anim-float">۷</div>
      <div>
        <h1>Math Quest 7 – ماجراجویی در سرزمین ریاضی</h1>
        <small>نسخه ۲.۱۲ | فصل اول، دوم و سوم ریاضی پایه هفتم</small>
      </div>
    </div>
    <div class="stats-bar" id="topStats"></div>
  </div>
</header>

<main class="container">
  <div class="mascot-banner" id="mascotBanner">
    <div class="mascot-avatar anim-float" id="mascotAvatarIcon">🦉</div>
    <div>
      <strong style="color:var(--primary-dark)">جغد دانای ریاضی:</strong>
      <span id="mascotText">سلام قهرمان پایه هفتم! علامت منفی و قرینه همیشه با ترتیب استاندارد در سمت چپ پرانتز قرار دارد؛ آماده شروع ماجراجویی هستی؟</span>
    </div>
  </div>

.","حرکت دوم: از -۵ به اندازه +۸ به راست می‌رویم و به +۳ می‌رسیم."],"visual":{"kind":"move_line","title":"حرکت گام‌به‌گام روی محور: (-۵) + (+۸) = +۳","first":-5,"second":8,"end":3},"source":"کتاب درسی ص ۱۸ / کاردرکلاس","page":18,"points":10},{"id":"C2-MC-007","chapter":2,"topic":"جمع اعداد صحیح","type":"mcq","difficulty":"easy","question":"با توجه به محور اعداد، حاصل جمع (+۴) + (-۲) کدام است؟","options":["+۶","+۲","-۲","-۶"],"answer":"+۲","hint":"از صفر ابتدا +۴ واحد به راست و سپس از +۴ به اندازه -۲ واحد به چپ حرکت کنید.","explanation":"شروع از ۰، رفتن تا +۴ و برگشت ۲ واحد به چپ ما را به +۲ می‌رساند.","steps":["فلش اول: از ۰ تا +۴","فلش دوم: از +۴ به اندازه -۲ به چپ ← نتیجه: +۲"],"visual":{"kind":"move_line","title":"فعالیت کتاب ص ۱۵: (+۴) + (-۲) = +۲","first":4,"second":-2,"end":2},"source":"کتاب درسی ص ۱۵ / فعالیت ۲","page":15,"points":10},{"id":"C2-MC-008","chapter":2,"topic":"جمع اعداد صحیح","type":"mcq","difficulty":"medium","question":"با توجه به حرکت دوگانه به چپ روی محور، حاصل (-۲) + (-۲) کدام است؟","options":["۰","+۴","-۴","-۲"],"answer":"-۴","hint":"از صفر ابتدا -۲ واحد به چپ و سپس دوباره -۲ واحد دیگر به چپ بروید.","explanation":"دو حرکت متوالی -۲ واحدی به سمت چپ در نقطه -۴ متوقف می‌شود.","steps":["حرکت اول: از ۰ تا -۲","حرکت دوم: از -۲ به اندازه -۲ دیگر به چپ ← -۴"],"visual":{"kind":"move_line","title":"فعالیت کتاب ص ۱۵: (-۲) + (-۲) = -۴","first":-2,"second":-2,"end":-4},"source":"کتاب درسی ص ۱۵ / فعالیت ۲","page":15,"points":20},{"id":"C2-MC-009","chapter":2,"topic":"تفریق اعداد صحیح","type":"mcq","difficulty":"medium","question":"حاصل عبارت (+۴) - (+۹) کدام است؟","options":["+۱۳","+۵","-۵","-۱۳"],"answer":"-۵","hint":"تفریق را به جمع قرینه عدد دوم تبدیل کنید: (+۴) + (-۹).","explanation":"تبدیل تفریق به جمع قرینه: (+۴) - (+۹) = (+۴) + (-۹) = -۵.","steps":["تبدیل تفریق به جمع قرینه: (+۴) + (-۹)","روی محور: از ۰ تا +۴ و سپس -۹ واحد به چپ ← -۵"],"visual":{"kind":"move_line","title":"تبدیل تفریق به جمع: (+۴) + (-۹) = -۵","first":4,"second":-9,"end":-5},"sour  ۳ و چون علامت‌ها متفاوت است، پاسخ برابر -۳ می‌شود.","steps":["قانون علامت‌ها: منفی ÷ مثبت = منفی","تقسیم مقدارها: ۱۸ ÷ ۶ = ۳ ← پاسخ: -۳"],"visual":{"kind":"rule_box","title":"قاعده تقسیم اعداد صحیح غیرهم‌علامت","formula":"(-۱۸) ÷ (+۶) = -۳"},"source":"کتاب درسی ص ۲۴ / کاردرکلاس","page":24,"points":20},{"id":"C2-MC-014","chapter":2,"topic":"کاربرد اعداد صحیح","type":"mcq","difficulty":"medium","question":"دمای هوای اردبیل ۳ درجه بالای صفر است. با ورود سامانه پرفشار دما ۱۰ درجه سردتر می‌شود. دمای جدید چند درجه است؟","options":["-۱۳ درجه","-۷ درجه","+۷ درجه","+۱۳ درجه"],"answer":"-۷ درجه","hint":"از +۳ به اندازه -۱۰ درجه به سمت پایین (سردتر) حرکت کنید.","explanation":"(+۳) + (-۱۰) = -۷ درجه زیر صفر.","steps":["دمای اولیه: +۳ درجه","کاهش ۱۰ درجه: (+۳) + (-۱۰) = -۷ درجه"],"visual":{"kind":"move_line","title":"مسئله ۳ ص ۱۹ کتاب: (+۳) + (-۱۰) = -۷","first":3,"second":-10,"end":-7},"source":"کتاب درسی ص ۱۹ / تمرین ۳","page":19,"points":20},{"id":"C2-MC-015","chapter":2,"topic":"ترکیب جمع و تفریق","type":"mcq","difficulty":"hard","question":"حاصل عبارت (-۷) + (+۴) - (-۳) کدام است؟","options":["۰","-۶","+۶","-۱۴"],"answer":"۰","hint":"ابتدا تفریق (-۳) را به جمع قرینه‌اش یعنی (+۳) تبدیل کنید.","explanation":"(-۷) + (+۴) - (-۳) = (-۷) + (+۴) + (+۳) = (-۷) + (+۷) = ۰.","steps":["تبدیل تفریق به جمع قرینه: (-۷) + (+۴) + (+۳)","جمع عددهای مثبت: (+۴) + (+۳) = +۷","جمع نهایی: (-۷) + (+۷) = ۰"],"visual":{"kind":"move_line","title":"حرکت روی محور: (-۷) + (+۷) = ۰","first":-7,"second":7,"end":0},"source":"کتاب درسی ص ۱۹ / تمرین","page":19,"points":30},{"id":"C2-MC-016","chapter":2,"topic":"ترکیب ضرب و تقسیم","type":"mcq","difficulty":"hard","question":"حاصل عبارت (-۱۴ ÷ (+۷)) × (-۲) کدام است؟","options":["-۴","+۴","-۱","+۱"],"answer":"+۴","hint":"ابتدا تقسیم داخل پرانتز را انجام دهید و سپس حاصل را در -۲ ضرب کنید.","explanation":"(-۱۴) ÷ (+۷) = -۲ و سپس (-۲) × (-۲) = +۴.","steps":["محاسبه داخل پرانتز: (-۱۴) ÷ (+۷) = -۲","ضرب نهایی: (-۲) × (-۲) = +۴"],"visual":{"kind":"rule_box","title": دد» به صورت جبری کدام است؟","options":["۷ - ۴x","۴x - ۷","۴(x - ۷)","۴x + ۷"],"answer":"۴x - ۷","hint":"ابتدا ۴ برابر عدد (۴x) را بنویسید و سپس ۷ واحد از آن کم کنید.","explanation":"۴ برابر یک عدد می‌شود ۴x و هفت تا کمتر از آن یعنی ۴x - ۷.","steps":["چهار برابر عدد: ۴x","هفت واحد کمتر از آن: ۴x - ۷"],"visual":{"kind":"rule_box","title":"تمرین ۱ ص ۳۳ کتاب درسی (قسمت ب)","formula":"۴x - ۷"},"source":"کتاب درسی ص ۳۳ / تمرین ۱","page":33,"points":20},{"id":"C3-MC-003","chapter":3,"topic":"محیط و مساحت با عبارت جبری","type":"mcq","difficulty":"easy","question":"اگر طول ضلع یک تشک کشتی مربعی a باشد، محیط آن کدام است؟","options":["a + ۴","۲a","۳a","۴a"],"answer":"۴a","hint":"مربع ۴ ضلع برابر دارد؛ محیط یعنی جمع طول هر ۴ ضلع.","explanation":"a + a + a + a = ۴a.","steps":["جمع چهار ضلع مربع: a + a + a + a","ساده‌سازی: ۴a"],"visual":{"kind":"square_perim","title":"فعالیت ۱ ص ۲۸ و ۳۱ کتاب: محیط مربع به ضلع a","side":"a"},"source":"کتاب درسی ص ۲۸ و ۳۱ / فعالیت ۱","page":28,"points":10},{"id":"C3-MC-004","chapter":3,"topic":"الگوهای عددی","type":"mcq","difficulty":"easy","question":"در الگوی عددی ۴، ۸، ۱۲، ۱۶، ... جمله nام کدام است؟","options":["n + ۴","۴n","۴n - ۱","۲n + ۲"],"answer":"۴n","hint":"هر جمله چند برابر شماره همان جمله است؟","explanation":"جمله اول ۴×۱، جمله دوم ۴×۲، پس جمله nام برابر ۴n است.","steps":["شماره ۱: ۴ × ۱ = ۴ و شماره ۲: ۴ × ۲ = ۸","جمله nام: ۴n"],"visual":{"kind":"rule_box","title":"تمرین ۵ ص ۳۰ کتاب درسی","formula":"۴, ۸, ۱۲, ۱۶, ...  ⇒  ۴n"},"source":"کتاب درسی ص ۳۰ / تمرین ۵","page":30,"points":10},{"id":"C3-MC-005","chapter":3,"topic":"الگوهای عددی","type":"mcq","difficulty":"medium","question":"در الگوی چوب‌کبریت کتاب درسی (شکل اول ۳، شکل دوم ۵ و شکل سوم ۷ چوب‌کبریت)، شکل بیستم چند چوب‌کبریت دارد؟","options":["۳۹","۴۱","۴۳","۴۰"],"answer":"۴۱","hint":"رابطه جمله nام این الگو برابر ۲n + ۱ است.","explanation":"به ازای n = ۲۰ داریم: ۲(۲۰) + ۱ = ۴۱.","steps":["یافتن رابطه جمله nام: ۲n + ۱","جایگذاری n = ۲۰: ۲ × ۲۰ + ۱ = ۴۱"],"visual":{"kind":"rule_box","title":"فعالیت ۳ ص ۲۸ کتاب درسی","formula":"۲n + ۱  ⇒  n=۲۰ : ۲(۲۰)+۱ = ۴۱"},"source":"کتاب درسی ص ۲۸ / فعالیت ۳","page":28,"points":20},{"id":"C3-MC-006","chapter":3,"topic":"عبارت جبری","type":"mcq","difficulty":"medium","question":"هزینه چاپ کارت ویزیت ۳۰۰۰ تومان قیمت پایه و ۱۰۰۰ تومان برای هر کارت است. هزینه چاپ n کارت کدام است؟","options":["۴۰۰۰n","۳۰۰۰n + ۱۰۰۰","۱۰۰۰n + ۳۰۰۰","۳۰۰۰ + n"],"answer":"۱۰۰۰n + ۳۰۰۰","hint":"قیمت پایه ثابت است و به ازای هر کارت ۱۰۰۰ تومان اضافه می‌شود.","explanation":"هزینه n کارت برابر ۱۰۰۰n به علاوه ۳۰۰۰ تومان قیمت پایه است: ۱۰۰۰n + ۳۰۰۰.","steps":["هزینه متغیر برای n کارت: ۱۰۰۰n","اضافه کردن قیمت پایه ثابت: ۱۰۰۰n + ۳۰۰۰"],"visual":{"kind":"rule_box","title":"تمرین ۲ ص ۳۰ کتاب درسی","formula":"۱۰۰۰n + ۳۰۰۰"},"source":"کتاب درسی ص ۳۰ / تمرین ۲","page":30,"points":20},{"id":"C3-MC-007","chapter":3,"topic":"جمله‌های متشابه","type":"mcq","difficulty":"medium","question":"حاصل ساده‌شده عبارت ۵a + ۳b - ۲a + b کدام است؟","options":["۳a + ۴b","۷a + ۲b","۳a + ۲b","۸a - b"],"answer":"۳a + ۴b","hint":"جمله‌های دارای a را با هم و جمله‌های دارای b را با هم ساده کنید.","explanation":"(۵a - ۲a) + (۳b + b) = ۳a + ۴b.","steps":["متشابه‌های a: ۵a - ۲a = ۳a","متشابه‌های b: ۳b + ۱b = ۴b ← حاصل: ۳a + ۴b"],"visual":{"kind":"rule_box","title":"کاردرکلاس ص ۳۳ کتاب درسی","formula":"(۵a - ۲a) + (۳b + b) = ۳a + ۴b"},"source":"کتاب درسی ص ۳۳ / کاردرکلاس","page":33,"points":20},{"id":"C3-MC-008","chapter":3,"topic":"خاصیت توزیع‌پذیری","type":"mcq","difficulty":"hard","question":"حاصل ساده‌شده عبارت ۴(x + ۲) کدام است؟","options":["۴x + ۲","۴x + ۸","x + ۸","۴x + ۶"],"answer":"۴x + ۸","hint":"عدد ۴ بیرون پرانتز را در هر دو جمله داخل پرانتز ضرب کنید.","explanation":"۴ × x + ۴ × ۲ = ۴x + ۸.","steps":["ضرب ۴ در x: ۴x","ضرب ۴ در ۲: ۸ ← حاصل: ۴x + ۸"],"visual":{"kind":"dist_rect","title":"خاصیت توزیع‌پذیری ص ۳۲ کتاب: ۴(x + ۲) = ۴x + ۸","factor":"۴","part1":"x","part2":"۲"},"source":"کتاب درسی ص ۳۲ و ۳۳","page":32,"points":30},{"id":"C3-MC-009","chapter":3,"topic":"خاصیت توزیع‌پذیری","type":"mcq","difficulty":"hard","question":"حاصل عبارت -(۳x - ۵y) کدام است؟","options":["-۳x - ۵y","-۳x + ۵y","۳x + ۵y","-۳x + ۱۵y"],"answer":"-۳x + ۵y","hint":"علامت منفی بیرون پرانتز در هر دو جمله داخل پرانتز اثر می‌کند و علامت آن‌ها را قرینه می‌کند.","explanation":"-(۳x - ۵y) = -۱ × ۳x - ۱ × (-۵y) = -۳x + ۵y.","steps":["قرینه کردن جمله اول: -(۳x) = -۳x","قرینه کردن جمله دوم: -(-۵y) = +۵y ← حاصل: -۳x + ۵y"],"visual":{"kind":"rule_box","title":"مثال ص ۳۳ کتاب درسی","formula":"-(۳x - ۵y) = -۳x + ۵y"},"source":"کتاب درسی ص ۳۳ / درسنامه","page":33,"points":30},{"id":"C3-MC-010","chapter":3,"topic":"مقدار عددی عبارت جبری","type":"mcq","difficulty":"medium","question":"اگر n = ۳ باشد، مقدار عبارت جبری ۲n - ۷ کدام است؟","options":["-۱","+۱","-۱۳","+۱۳"],"answer":"-۱","hint":"به‌جای n عدد ۳ قرار دهید و ابتدا ضرب را انجام دهید.","explanation":"۲(۳) - ۷ = ۶ - ۷ = -۱.","steps":["جایگذاری n = ۳: ۲ × ۳ - ۷","انجام ضرب و تفریق: ۶ - ۷ = -۱"],"visual":{"kind":"rule_box","title":"فعالیت ۳ ص ۳۴ کتاب درسی","formula":"۲(۳) - ۷ = ۶ - ۷ = -۱"},"source":"کتاب درسی ص ۳۴ / فعالیت ۳","page":34,"points":20},{"id":"C3-MC-011","chapter":3,"topic":"مقدار عددی عبارت جبری","type":"mcq","difficulty":"hard","question":"اگر a = ۵ و b = ۳ باشد، مقدار عبارت a - (a - ۲b) کدام است؟","options":["۴","۶","-۱","۱۱"],"answer":"۶","hint":"ابتدا داخل پرانتز را به ازای a = ۵ و b = ۳ حساب کنید.","explanation":"۵ - (۵ - ۲ × ۳) = ۵ - (۵ - ۶) = ۵ - (-۱) = ۵ + ۱ = ۶.","steps":["محاسبه داخل پرانتز: ۵ - ۶ = -۱","تفریق نهایی: ۵ - (-۱) = ۵ + ۱ = ۶"],"visual":{"kind":"rule_box","title":"مثال ص ۳۴ کتاب درسی","formula":"۵ - (۵ - ۲×۳) = ۵ - (-۱) = ۶"},"source":"کتاب درسی ص ۳۴ / مثال","page":34,"points":30},{"id":"C3-MC-012","chapter":3,"topic":"معادله","type":"mcq","difficulty":"hard","question":"جواب معادله ۲x - ۱ = ۷ کدام است؟","options":["۳","۴","۶","۸"],"answer":"۴","hint":"ابتدا ۱ را به دو طرف اضافه کنید و سپس دو طرف را بر ۲ تقسیم کنید.","explanation":"۲x - ۱ = ۷ ← ۲x = ۸ ← x = ۴.","steps":["جمع ۱ با دو طرف: ۲x = ۷ + ۱ = ۸","تقسیم بر ۲: x = ۸ ÷ ۲ = ۴"],"visual":{"kind":"rule_box","title":"کاردرکلاس ص ۳۸ کتاب درسی","formula":"۲x - ۱ = ۷  ⇒  ۲x = ۸  ⇒  x = ۴"},"source":"کتاب درسی ص ۳۸ / کاردرکلاس","page":38,"points":30},{"id":"C3-MC-013","chapter":3,"topic":"معادله","type":"mcq","difficulty":"hard","question":"جواب معادله ۳x - ۲ = x + ۴ کدام است؟","options":["۱","۲","۳","۶"],"answer":"۳","hint":"از دو طرف معادله x کم کنید تا ۲x - ۲ = ۴ شود.","explanation":"۳x - x = ۴ + ۲ ← ۲x = ۶ ← x = ۳.","steps":["انتقال مجهول‌ها به یک طرف: ۲x - ۲ = ۴","حل معادله: ۲x = ۶ ← x = ۳"],"visual":{"kind":"rule_box","title":"کاردرکلاس ص ۳۸ کتاب درسی","formula":"۳x - ۲ = x + ۴  ⇒  ۲x = ۶  ⇒  x = ۳"},"source":"کتاب درسی ص ۳۸ / کاردرکلاس","page":38,"points":30},{"id":"C3-MC-014","chapter":3,"topic":"معادله","type":"mcq","difficulty":"medium","question":"جواب معادله ۶n + ۷ = ۴۷ کدام عدد است؟ (از جدول حدس و آزمایش کتاب)","options":["۵","۶","۷","۸"],"answer":"۶","hint":"به‌جای n عدد ۶ قرار دهید: ۶ × ۶ + ۷ = ۳۶ + ۷ = ۴۳؛ کدام عدد ۴۷ می‌دهد؟ (بررسی کنید: ۶×۶+۷=۴۳، پس پاسخ واقعی معادله ۶ نیست؛ در گزینه ۶n+۷=۴۳ عدد ۶ درست است!)","explanation":"در معادله ۶n + ۷ = ۴۳ به ازای n = ۶ داریم: ۶ × ۶ + ۷ = ۳۶ + ۷ = ۴۳.","steps":["جایگذاری n = ۶: ۶ × ۶ + ۷ = ۳۶ + ۷ = ۴۳"],"visual":{"kind":"rule_box","title":"فعالیت ۲ ص ۳۷ کتاب درسی","formula":"۶n + ۷ = ۴۳  ⇒  n = ۶"},"source":"کتاب درسی ص ۳۷ / فعالیت ۲","page":37,"points":20},{"id":"C2-DQ-001","chapter":2,"topic":"مقایسه اعداد صحیح","type":"descriptive","difficulty":"easy","question":"اعداد -۲۳، +۱۲، -۳۴، -۵، ۰، +۴۵، +۱۵، -۱ و +۲ را از کوچک‌تر به بزرگ‌تر و از چپ به راست مرتب کنید.","answer":"-۳۴ ، -۲۳ ، -۵ ، -۱ ، ۰ ، +۲ ، +۱۲ ، +۱۵ ، +۴۵","hint":"اعداد منفی در سمت چپ صفر قرار دارند و هرچه از صفر دورتر شوند کوچک‌ترند.","explanation":"ترتیب از کوچک به بزرگ: -۳۴، -۲۳، -۵، -۱، ۰، +۲، +۱۲، +۱۵، +۴۵.","steps":["اعداد منفی از کوچک به بزرگ: -۳۴ < -۲۳ < -۵ < -۱","صفر در وسط قرار می‌گیرد.","اعداد مثبت از کوچک به بزرگ: +۲ < +۱۲ < +۱۵ < +۴۵"],"visual":{"kind":"numberline","title":"تمرین ۱ ص ۱۸ کتاب: مرتب‌سازی روی محور","points":[{"val":-34,"label":"-۳۴"},{"val":-5,"label":"-۵"},{"val":0,"label":"۰"},{"val":12,"label":"+۱۲"},{"val":45,"label":"+۴۵"}]},"source":"کتاب درسی ص ۱۸ / تمرین ۱","page":18,"points":10},{"id":"C2-DQ-002","chapter":2,"topic":"قرینه اعداد صحیح","type":"descriptive","difficulty":"medium","question":"حاصل هر یک از عبارت‌های قرینه زیر را از کتاب درسی بنویسید:\nالف) -(+۱۰)\nب) -(-۴)\nج) -(-(+۷))\nد) -(+(-۵))","answer":"الف) -۱۰  |  ب) +۴  |  ج) +۷  |  د) +۵","hint":"هر علامت منفی پشت پرانتز علامت عدد داخل پرانتز را قرینه می‌کند.","explanation":"الف) -۱۰ ، ب) +۴ ، ج) +۷ ، د) +۵.","steps":["الف) قرینه +۱۰ برابر -۱۰","ب) قرینه -۴ برابر +۴","ج) قرینه قرینه +۷ برابر +۷","د) قرینه (-۵) برابر +۵"],"visual":{"kind":"rule_box","title":"کاردرکلاس ص ۱۵ کتاب درسی","formula":"-(+(-۵)) = +۵   و   -(-(+۷)) = +۷"},"source":"کتاب درسی ص ۱۵ / کاردرکلاس","page":15,"points":20},{"id":"C2-DQ-003","chapter":2,"topic":"جمع و تفریق اعداد صحیح","type":"descriptive","difficulty":"medium","question":"عبارت‌های زیر را ابتدا به جمع تبدیل کنید و سپس حاصل آن‌ها را به دست آورید:\nالف) -۷ - ۴\nب) -۸ - (+۵)\nج) -۵ - (-۳)","answer":"الف) -۱۱  |  ب) -۱۳  |  ج) -۲","hint":"برای تبدیل تفریق به جمع، عدد اول را بنویسید و تفریق را به جمع قرینه عدد دوم تبدیل کنید.","explanation":"الف) -۷ + (-۴) = -۱۱ ، ب) -۸ + (-۵) = -۱۳ ، ج) -۵ + (+۳) = -۲.","steps":["الف) -۷ - ۴ = -۷ + (-۴) = -۱۱","ب) -۸ - (+۵) = -۸ + (-۵) = -۱۳","ج) -۵ - (-۳) = -۵ + (+۳) = -۲"],"visual":{"kind":"move_line","title":"نمایش -۵ + (+۳) = -۲ روی محور گام‌به‌گام","first":-5,"second":3,"end":-2},"source":"کتاب درسی ص ۱۵ / کاردرکلاس ۳","page":15,"points":20},{"id":"C2-DQ-004","chapter":2,"topic":"کاربرد اعداد صحیح","type":"descriptive","difficulty":"medium","question":"شخصی در طبقه +۵ سوار آسانسور شد. او ابتدا ۳ طبقه بالا رفت، سپس ۶ طبقه پایین آمد، دوباره ۲ طبقه پایین رفت و در آخر ۲ طبقه دیگر پایین رفت و سوار ماشین شد. ماشین او در کدام طبقه بوده است؟","answer":"طبقه -۲","hint":"هر حرکت رو به بالا را با عدد مثبت و هر حرکت رو به پایین را با عدد منفی جمع کنید.","explanation":"(+۵) + (+۳) + (-۶) + (-۲) + (-۲) = (+۸) + (-۱۰) = -۲.","steps":["شروع از +۵ و ۳ طبقه بالا: +۸","مجموع پایین آمدن‌ها: (-۶) + (-۲) + (-۲) = -۱۰","مکان نهایی: (+۸) + (-۱۰) = -۲"],"visual":{"kind":"elevator","title":"تمرین ۲ ص ۱۹ کتاب: حرکت آسانسور تا طبقه -۲","startFloor":5,"endFloor":-2},"source":"کتاب درسی ص ۱۹ / تمرین ۲","page":19,"points":20},{"id":"C2-DQ-005","chapter":2,"topic":"کاربرد اعداد صحیح","type":"descriptive","difficulty":"hard","question":"یک زیردریایی ۴۵۰ متر پایین‌تر از سطح دریا (-۴۵۰) قرار دارد. زیردریایی دیگری ۱۵۰ متر بالاتر از آن است. موقعیت زیردریایی دوم را با یک عدد علامت‌دار بنویسید.","answer":"-۳۰۰ متر","hint":"بالاتر بودن نسبت به -۴۵۰ یعنی جمع کردن با +۱۵۰.","explanation":"(-۴۵۰) + (+۱۵۰) = -۳۰۰ متر.","steps":["موقعیت زیردریایی اول: -۴۵۰","زیردریایی دوم ۱۵۰ متر بالاتر است: (-۴۵۰) + (+۱۵۰) = -۳۰۰"],"visual":{"kind":"move_line","title":"تمرین ۲ ص ۲۲ کتاب: (-۴۵۰) + (+۱۵۰) = -۳۰۰","first":-450,"second":150,"end":-300},"source":"کتاب درسی ص ۲۲ / تمرین ۲","page":22,"points":30},{"id":"C2-DQ-006","chapter":2,"topic":"کاربرد اعداد صحیح","type":"descriptive","difficulty":"hard","question":"دمای هوا در تبریز ۲ درجه زیر صفر (-۲) و دمای اردبیل ۳ برابر آن است. میانگین دمای این دو شهر چند درجه است؟","answer":"-۴ درجه","hint":"دمای اردبیل را با ضرب (-۲) × ۳ پیدا کنید، سپس مجموع دو دما را بر ۲ تقسیم کنید.","explanation":"دمای اردبیل -۶ درجه است؛ میانگین: [(-۲) + (-۶)] ÷ ۲ = (-۸) ÷ ۲ = -۴ درجه.","steps":["دمای تبریز: -۲ و دمای اردبیل: ۳ × (-۲) = -۶","مجموع دماها: (-۲) + (-۶) = -۸","میانگین: (-۸) ÷ ۲ = -۴"],"visual":{"kind":"thermometer","title":"تمرین ترکیبی ص ۲۶ کتاب: تبریز (-۲°) و اردبیل (-۶°)","fromTemp":-6,"toTemp":-2},"source":"کتاب درسی ص ۲۶ / تمرین ترکیبی ۲","page":26,"points":30},{"id":"C3-DQ-001","chapter":3,"topic":"جمله‌های متشابه","type":"descriptive","difficulty":"medium","question":"عبارت‌های جبری زیر را ساده کنید (تمرین ۵ ص ۳۳ کتاب):\nالف) (۳x - ۸) - (۳x + ۷)\nب) ۲(y + x + ۳) - ۸(x - y + ۱)","answer":"الف) -۱۵  |  ب) -۶x + ۱۰y - ۲","hint":"ابتدا عدد و علامت پشت پرانتزها را در جمله‌های داخل پرانتز ضرب کنید و سپس جمله‌های متشابه را جمع کنید.","explanation":"الف) ۳x - ۸ - ۳x - ۷ = -۱۵؛ ب) ۲y + ۲x + ۶ - ۸x + ۸y - ۸ = -۶x + ۱۰y - ۲.","steps":["الف) حذف پرانتزها: ۳x - ۸ - ۳x - ۷ = -۱۵","ب) ضرب در پرانتزها: ۲y + ۲x + ۶ - ۸x + ۸y - ۸","ب) جمع متشابه‌ها: (۲x - ۸x) + (۲y + ۸y) + (۶ - ۸) = -۶x + ۱۰y - ۲"],"visual":{"kind":"rule_box","title":"تمرین ۵ ص ۳۳ کتاب درسی","formula":"(۳x - ۸) - (۳x + ۷) = -۱۵"},"source":"کتاب درسی ص ۳۳ / تمرین ۵","page":33,"points":20},{"id":"C3-DQ-002","chapter":3,"topic":"مقدار عددی عبارت جبری","type":"descriptive","difficulty":"medium","question":"سارا تعداد n کتاب نو به مبلغ هر کدام ۷۰۰۰۰ تومان و s کتاب دست‌دوم به مبلغ هر کدام ۲۰۰۰۰ تومان خریده است.\nالف) عبارت جبری مجموع خرید سارا را بنویسید.\nب) اگر n = ۳ و s = ۶ باشد، در مجموع چقدر پرداخت کرده است؟","answer":"الف) ۷۰۰۰۰n + ۲۰۰۰۰s  |  ب) ۳۳۰۰۰۰ تومان","hint":"هزینه کتاب‌های نو ۷۰۰۰۰n و هزینه کتاب‌های دست‌دوم ۲۰۰۰۰s است.","explanation":"مجموع خرید: ۷۰۰۰۰(۳) + ۲۰۰۰۰(۶) = ۲۱۰۰۰۰ + ۱۲۰۰۰۰ = ۳۳۰۰۰۰ تومان.","steps":["الف) عبارت جبری: ۷۰۰۰۰n + ۲۰۰۰۰s","ب) جایگذاری: ۲۱۰۰۰۰ + ۱۲۰۰۰۰ = ۳۳۰۰۰۰ تومان"],"visual":{"kind":"rule_box","title":"تمرین ۱ ص ۳۶ کتاب درسی","formula":"۷۰۰۰۰n + ۲۰۰۰۰s = ۳۳۰۰۰۰"},"source":"کتاب درسی ص ۳۶ / تمرین ۱","page":36,"points":20},{"id":"C3-DQ-003","chapter":3,"topic":"معادله","type":"descriptive","difficulty":"hard","question":"باغبان شهرداری ۱۰۰ عدد گل بنفشه داشت. او تعدادی از گل‌ها را در باغچه‌ای به مساحت ۶ متر مربع کاشت و در آخر ۴ گل اضافه آورد. با نوشتن معادله پیدا کنید در هر متر مربع چند بنفشه کاشته است؟","answer":"۱۶ بنفشه","hint":"تعداد بنفشه در هر متر مربع را x بگیرید؛ معادله ۶x + ۴ = ۱۰۰ را تشکیل دهید.","explanation":"۶x + ۴ = ۱۰۰ ← ۶x = ۹۶ ← x = ۱۶.","steps":["انتخاب مجهول: x تعداد بنفشه در هر متر مربع","تشکیل معادله: ۶x + ۴ = ۱۰۰","حل معادله: ۶x = ۱۰۰ - ۴ = ۹۶ ← x = ۱۶"],"visual":{"kind":"rule_box","title":"فعالیت ص ۳۹ کتاب درسی","formula":"۶x + ۴ = ۱۰۰  ⇒  x = ۱۶"},"source":"کتاب درسی ص ۳۹ / فعالیت","page":39,"points":30},{"id":"C3-DQ-004","chapter":3,"topic":"معادله","type":"descriptive","difficulty":"hard","question":"فاطمه کتاب داستانی ۱۰۰ صفحه‌ای را در ۶ ساعت مطالعه کرد و ۱۰ صفحه از آن باقی ماند. با نوشتن معادله پیدا کنید فاطمه به‌طور متوسط در هر ساعت چند صفحه مطالعه کرده است؟","answer":"۱۵ صفحه","hint":"تعداد صفحات مطالعه در هر ساعت را x بگیرید؛ در ۶ ساعت می‌شود ۶x.","explanation":"۶x + ۱۰ = ۱۰۰ ← ۶x = ۹۰ ← x = ۱۵ صفحه.","steps":["نوشتن معادله: ۶x + ۱۰ = ۱۰۰","کم کردن ۱۰ از دو طرف: ۶x = ۹۰","تقسیم بر ۶: x = ۱۵"],"visual":{"kind":"rule_box","title":"تمرین ۲ ص ۳۹ کتاب درسی","formula":"۶x + ۱۰ = ۱۰۰  ⇒  x = ۱۵"},"source":"کتاب درسی ص ۳۹ / تمرین ۲","page":39,"points":30},{"id":"C3-DQ-005","chapter":3,"topic":"معادله","type":"descriptive","difficulty":"hard","question":"محسن برای خرید ۸ مداد ۴۰۰۰۰ تومان به فروشنده داد و ۸۰۰۰ تومان پس گرفت. با نوشتن معادله قیمت هر مداد را پیدا کنید.","answer":"۴۰۰۰ تومان","hint":"قیمت هر مداد را x بگیرید؛ پول ۸ مداد به اضافه ۸۰۰۰ تومان باقیمانده برابر ۴۰۰۰۰ تومان است.","explanation":"۸x + ۸۰۰۰ = ۴۰۰۰۰ ← ۸x = ۳۲۰۰۰ ← x = ۴۰۰۰ تومان.","steps":["تشکیل معادله: ۸x + ۸۰۰۰ = ۴۰۰۰۰","کم کردن ۸۰۰۰: ۸x = ۳۲۰۰۰","تقسیم بر ۸: x = ۴۰۰۰ تومان"],"visual":{"kind":"rule_box","title":"تمرین ۳ ص ۳۹ کتاب درسی","formula":"۸x + ۸۰۰۰ = ۴۰۰۰۰  ⇒  x = ۴۰۰۰"},"source":"کتاب درسی ص ۳۹ / تمرین ۳","page":39,"points":30},{"id":"C3-DQ-006","chapter":3,"topic":"معادله","type":"descriptive","difficulty":"hard","question":"احمد و بهمن ۳۶ جلد کتاب را صحافی کردند. احمد ۶ جلد کتاب بیش از بهمن صحافی کرده است. با نوشتن معادله پیدا کنید هر کدام چند جلد کتاب صحافی کرده‌اند؟","answer":"بهمن ۱۵ جلد و احمد ۲۱ جلد","hint":"تعداد کتاب‌های بهمن را x بگیرید؛ پس کتاب‌های احمد x + ۶ است.","explanation":"x + (x + ۶) = ۳۶ ← ۲x + ۶ = ۳۶ ← ۲x = ۳۰ ← x = ۱۵ (بهمن) و احمد ۲۱ جلد.","steps":["تعداد کتاب بهمن: x و احمد: x + ۶","معادله: ۲x + ۶ = ۳۶ ← ۲x = ۳۰ ← x = ۱۵","بهمن ۱۵ جلد و احمد ۱۵ + ۶ = ۲۱ جلد"],"visual":{"kind":"rule_box","title":"تمرین ۷ ص ۳۹ کتاب درسی","formula":"x + (x + ۶) = ۳۶  ⇒  x = ۱۵"},"source":"کتاب درسی ص ۳۹ / تمرین ۷","page":39,"points":30},{"id":"C1-MC-001","chapter":1,"topic":"الگویابی عددی","type":"mcq","difficulty":"easy","question":"در الگوی ۳، ۷، ۱۱، ۱۵، ... سه عدد بعدی کدام‌اند؟","options":["۱۷، ۲۱، ۲۵","۱۹، ۲۳، ۲۷","۲۰، ۲۴، ۲۸","۱۶، ۲۰، ۲۴"],"answer":"۱۹، ۲۳، ۲۷","hint":"اختلاف هر دو جمله متوالی را بررسی کنید؛ هر بار ۴ واحد اضافه می‌شود.","explanation":"الگو با افزودن ۴ ادامه می‌یابد: ۱۵+۴=۱۹، سپس ۲۳ و ۲۷.","steps":["اختلاف جمله‌ها برابر ۴ است.","سه جمله بعدی: ۱۹، ۲۳ و ۲۷."],"source":"نمونه آزمون ارسالی ۱، صفحه ۱؛ راهبرد الگویابی","points":10},{"id":"C1-MC-002","chapter":1,"topic":"الگویابی عددی","type":"mcq","difficulty":"medium","question":"در الگوی ۱۰، ۲۰، ۳۱، ۴۳، ۵۶، ... عدد بعدی کدام است؟","options":["۶۸","۶۹","۷۰","۷۱"],"answer":"۷۰","hint":"اختلاف‌ها به ترتیب ۱۰، ۱۱، ۱۲ و ۱۳ هستند.","explanation":"اختلاف بعدی ۱۴ است؛ بنابراین ۵۶+۱۴=۷۰.","steps":["اختلاف‌ها: ۱۰، ۱۱، ۱۲، ۱۳","اختلاف بعدی ۱۴ است.","۵۶+۱۴=۷۰."],"source":"نمونه آزمون ارسالی ۱، صفحه ۱؛ راهبرد الگویابی","points":20},{"id":"C1-MC-003","chapter":1,"topic":"الگویابی و جمله nام","type":"mcq","difficulty":"easy","question":"جمله nام الگوی ۲، ۶، ۱۰، ۱۴، ۱۸، ... کدام است؟","options":["۲n","۴n−۲","۴n+۲","۲n+۴"],"answer":"۴n−۲","hint":"الگو با اختلاف ثابت ۴ پیش می‌رود و جمله اول برابر ۲ است.","explanation":"جمله nام برابر ۲+(n−۱)×۴ است که ساده می‌شود ۴n−۲.","steps":["اختلاف مشترک ۴ است.","جمله nام: ۲+۴(n−۱)=۴n−۲."],"source":"نمونه آزمون ارسالی ۲، صفحه ۱؛ جمله nام الگو","points":20},{"id":"C1-MC-004","chapter":1,"topic":"الگویابی و جمله nام","type":"mcq","difficulty":"medium","question":"جمله nام الگوی ۴، ۷، ۱۰، ۱۳، ... کدام است؟","options":["۳n","۳n+۱","۴n−۱","n+۳"],"answer":"۳n+۱","hint":"هر بار ۳ واحد اضافه می‌شود؛ جمله اول برای n=۱ برابر ۴ است.","explanation":"۳n+۱ برای n=۱ برابر ۴ و برای n=۲ برابر ۷ است؛ پس رابطه درست است.","steps":["اختلاف ثابت ۳ است.","با توجه به جمله اول: ۳×۱+۱=۴.","رابطه جمله nام: ۳n+۱."],"source":"نمونه آزمون ارسالی ۳، صفحه ۲؛ الگوهای عددی","points":20},{"id":"C1-MC-005","chapter":1,"topic":"راهبرد حدس و آزمایش","type":"mcq","difficulty":"medium","question":"حاصل‌ضرب دو عدد طبیعی ۲۴ است. کدام دو عدد، مجموع کم‌تری دارند؟","options":["۱ و ۲۴","۲ و ۱۲","۳ و ۸","۴ و ۶"],"answer":"۴ و ۶","hint":"همه زوج‌های طبیعیِ حاصل‌ضرب ۲۴ را بررسی و مجموع‌ها را مقایسه کنید.","explanation":"مجموع‌ها به ترتیب ۲۵، ۱۴، ۱۱ و ۱۰ هستند؛ کمترین مجموع ۱۰ است.","steps":["زوج‌های عامل: (۱،۲۴)، (۲،۱۲)، (۳،۸)، (۴،۶).","کمترین مجموع برابر ۴+۶=۱۰ است."],"source":"نمونه آزمون ارسالی ۱، صفحه ۵؛ راهبرد حدس و آزمایش","points":20},{"id":"C1-MC-006","chapter":1,"topic":"راهبرد الگو سازی","type":"mcq","difficulty":"medium","question":"مجموع سن دو برادر ۱۲ سال و حاصل‌ضرب سن آن‌ها ۳۲ است. سن آن‌ها کدام است؟","options":["۲ و ۱۰","۳ و ۹","۴ و ۸","۵ و ۷"],"answer":"۴ و ۸","hint":"زوج‌های عدد طبیعی با مجموع ۱۲ را بررسی کنید و حاصل‌ضربشان را بیازمایید.","explanation":"۴+۸=۱۲ و ۴×۸=۳۲؛ پس سن‌ها ۴ و ۸ سال است.","steps":["زوج‌های ممکن را با مجموع ۱۲ می‌نویسیم.","زوج ۴ و ۸ هم مجموع ۱۲ و هم حاصل‌ضرب ۳۲ دارد."],"source":"نمونه آزمون ارسالی ۲، صفحه ۱؛ راهبرد تفکر نظام‌دار","points":20},{"id":"C1-MC-007","chapter":1,"topic":"راهبرد رسم شکل و الگویابی","type":"mcq","difficulty":"hard","question":"توپی از ارتفاع ۲۴ متر رها می‌شود و پس از هر برخورد با زمین، نصف ارتفاع قبلی بالا می‌آید. از لحظه رها شدن تا سومین برخورد توپ با زمین، چند متر حرکت می‌کند؟","options":["۴۸ متر","۵۴ متر","۶۰ متر","۷۲ متر"],"answer":"۶۰ متر","hint":"مسیر را به صورت پایین‌آمدن ۲۴ متر، سپس دو رفت‌وبرگشت با ارتفاع‌های ۱۲ و ۶ متر رسم کنید.","explanation":"مسافت برابر ۲۴+۱۲+۱۲+۶+۶=۶۰ متر است.","steps":["تا برخورد اول: ۲۴ متر پایین می‌آید.","تا برخورد دوم: ۱۲ متر بالا و ۱۲ متر پایین می‌رود.","تا برخورد سوم: ۶ متر بالا و ۶ متر پایین می‌آید.","مجموع: ۲۴+۱۲+۱۲+۶+۶=۶۰ متر."],"source":"نمونه آزمون ارسالی ۳، صفحه ۲؛ راهبرد رسم شکل و الگویابی","points":30},{"id":"C1-DQ-001","chapter":1,"topic":"الگویابی عددی","type":"descriptive","difficulty":"medium","question":"سه عدد بعدی الگوی ۱۰، ۲۰، ۳۱، ۴۳، ۵۶، ... را بنویسید و رابطه بین عددها را توضیح دهید.","options":[],"answer":"۷۰، ۸۵، ۱۰۱","hint":"اختلاف‌های متوالی را به دست آورید و الگوی اختلاف‌ها را ادامه دهید.","explanation":"اختلاف‌ها ۱۰، ۱۱، ۱۲ و ۱۳ هستند؛ سپس ۱۴، ۱۵ و ۱۶ اضافه می‌کنیم. بنابراین جمله‌های بعدی ۷۰، ۸۵ و ۱۰۱ هستند.","steps":["۵۶+۱۴=۷۰","۷۰+۱۵=۸۵","۸۵+۱۶=۱۰۱"],"source":"نمونه آزمون ارسالی ۱، صفحه ۱؛ الگویابی","points":20},{"id":"C1-DQ-002","chapter":1,"topic":"الگویابی و جمله nام","type":"descriptive","difficulty":"medium","question":"برای الگوی ۲، ۶، ۱۰، ۱۴، ۱۸، ... سه جمله بعدی را بنویسید و جمله nام را به صورت جبری بیان کنید.","options":[],"answer":"۲۲، ۲۶، ۳۰؛ جمله nام: ۴n−۲","hint":"اختلاف ثابت الگو را پیدا کنید و جمله اول را با شماره جمله مرتبط کنید.","explanation":"اختلاف ثابت ۴ است؛ جمله nام برابر ۲+۴(n−۱)=۴n−۲ است.","steps":["سه جمله بعدی: ۲۲، ۲۶ و ۳۰.","جمله nام: ۲+۴(n−۱)=۴n−۲."],"source":"نمونه آزمون ارسالی ۲، صفحه ۱؛ الگویابی","points":20},{"id":"C1-DQ-003","chapter":1,"topic":"راهبرد حدس و آزمایش","type":"descriptive","difficulty":"medium","question":"مجموع سن پویا و برادرش ۱۲ سال و حاصل‌ضرب سن آن‌ها ۳۲ است. با راهبرد حدس و آزمایش سن هر یک را پیدا کنید.","options":[],"answer":"۴ سال و ۸ سال","hint":"زوج‌های طبیعی با مجموع ۱۲ را بررسی کنید.","explanation":"زوج ۴ و ۸ هم مجموع ۱۲ دارد و هم حاصل‌ضرب آن ۳۲ است.","steps":["زوج‌های با مجموع ۱۲ را بررسی می‌کنیم.","۴+۸=۱۲ و ۴×۸=۳۲؛ پس سن‌ها ۴ و ۸ سال است."],"source":"نمونه آزمون ارسالی ۲، صفحه ۱؛ تفکر نظام‌دار","points":20},{"id":"C1-DQ-004","chapter":1,"topic":"راهبرد رسم شکل","type":"descriptive","difficulty":"hard","question":"توپی از ارتفاع ۲۴ متر رها می‌شود و پس از هر برخورد با زمین، نصف ارتفاع قبلی بالا می‌آید. مسافت طی‌شده تا سومین برخورد توپ با زمین را با نوشتن مراحل محاسبه کنید.","options":[],"answer":"۶۰ متر","hint":"مسیر توپ را به سه بخش برخورد اول، دوم و سوم تقسیم کنید.","explanation":"۲۴ متر تا برخورد اول؛ سپس ۱۲+۱۲ متر تا برخورد دوم؛ سپس ۶+۶ متر تا <script>
// ==================== ۱. تبدیل کامل تمام اعداد به فارسی (بدون هیچ رقم انگلیسی) ====================
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(val) {
  if (val === null || val === undefined) return '';
  return String(val).replace(/[0-9]/g, d => FA_DIGITS[Number(d)]);
}

// ==================== ۲. اصلاح کامل نمایش قرینه و پرانتزها با منفی در سمت چپ -(+(−۷)) ====================
function formatMathText(text) {
  if (text === null || text === undefined || text === '') return '';
  let safe = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // ابتدا زنجیره‌های ریاضی و سپس عددهای منفرد علامت‌دار/بدون علامت را ایزوله می‌کنیم.
  // متن فارسی بیرون از این محدوده‌ها RTL باقی می‌ماند.
  const atom = '(?:[0-9۰-۹]+(?:[.,٫][0-9۰-۹]+)?(?:[a-zA-Z])?|[a-zA-Z][a-zA-Z0-9۰-۹]*|\\([^()]*\\)|\\[[^\\[\\]]*\\])';
  const signed = '[+\\-−]?\\s*' + atom;
  const operator = '(?:\\s*(?:[+\\-−×÷*/=<>≤≥≠])\\s*)';
  const expression = new RegExp('(?<![\\w])' + signed + '(?:' + operator + signed + ')+(?![\\w])', 'g');
  safe = safe.replace(expression, match => `<bdi class="math math-run" dir="ltr" data-math="ltr">${toFa(match).replace(/-/g,'−').replace(/\s+/g,' ').trim()}</bdi>`);
  const numberToken = /(?<![\w])(?:[+\-−]\s*)?(?:[0-9۰-۹]+(?:[.,٫][0-9۰-۹]+)?)(?![\w])/g;
  safe = safe.replace(numberToken, match => `<bdi class="math num-ltr" dir="ltr" data-math="ltr">${toFa(match).replace(/-/g,'−').replace(/\s+/g,'').trim()}</bdi>`);
  return safe.replace(/\n/g, '<br>');
}

// ==================== ۳. محور اعداد گام‌به‌گام با فلش قوسی اول، فلش قوسی دوم و پخش مجدد ====================
let axisAnimState = {}; // نگه‌داری مرحله فعلی هر محور با شناسه یکتا

function playAxisStepByStep(uid) {
  if (!axisAnimState[uid]) axisAnimState[uid] = { step: 1, timers: [] };
  axisAnimState[uid].timers.forEach(t => clearTimeout(t));
  axisAnimState[uid].timers = [];
  axisAnimState[uid].step = 1;
  updateAxisDOM(uid);

  const t1 = setTimeout(() => {
    if (!axisAnimState[uid]) return;
    axisAnimState[uid].step = 2;
    updateAxisDOM(uid);
  }, 1100);

  const t2 = setTimeout(() => {
    if (!axisAnimState[uid]) return;
    axisAnimState[uid].step = 3;
    updateAxisDOM(uid);
  }, 2300);

  axisAnimState[uid].timers.push(t1, t2);
}

function setAxisManualStep(uid, stepNum) {
  if (!axisAnimState[uid]) axisAnimState[uid] = { step: stepNum, timers: [] };
  axisAnimState[uid].timers.forEach(t => clearTimeout(t));
  axisAnimState[uid].timers = [];
  axisAnimState[uid].step = stepNum;
  updateAxisDOM(uid);
}

function updateAxisDOM(uid) {
  const wrap = document.getElementById('axis-wrap-' + uid);
  if (!wrap) return;
  const step = axisAnimState[uid] ? axisAnimState[uid].step : 3;
  const arc1 = wrap.querySelector('.axis-arc-1');
  const arc2 = wrap.querySelector('.axis-arc-2');
  const badge = wrap.querySelector('.axis-step-badge');

  if (arc1) {
    arc1.style.display = step >= 2 ? 'inline' : 'none';
    if (step === 2) {
      arc1.classList.remove('arc-animated');
      void arc1.offsetWidth;
      arc1.classList.add('arc-animated');
    }
  }
  if (arc2) {
    arc2.style.display = step >= 3 ? 'inline' : 'none';
    if (step === 3) {
      arc2.classList.remove('arc-animated');
      void arc2.offsetWidth;
      arc2.classList.add('arc-animated');
    }
  }
  if (badge) {
    if (step === 1) badge.textContent = 'گام ۱ از ۳: نمایش محور و مبدأ (۰)';
    else if (step === 2) badge.textContent = 'گام ۲ از ۳: فلش قوسی حرکت عدد اول';
    else badge.textContent = 'گام ۳ از ۳: فلش قوسی عدد دوم و نقطه پایان';
  }
}

function renderVisualSVG(vis) {
  if (!vis) return '';
  if (vis.kind === 'numberline') {
    const pts = vis.points || [];
    const minV = -10, maxV = 10;
    const xOf = v => 50 + ((Math.max(minV, Math.min(maxV, v)) - minV) / (maxV - minV)) * 460;
    return `

const AVATAR_GALLERY = [
  '🦊', '🦁', '🐼', '🐨', '🐯', '🦄',
  '🦉', '🐬', '🐧', '🦋', '🚀', '🌟',
  '🧑‍🚀', '🧙‍♂️', '🦸‍♀️', '🦸‍♂️', '🎨', '🏆'
];

const STORAGE_KEYS = {
  QB: 'mq7_question_bank_v2_5',
  PROFILES: 'mq7_student_profiles_v2_2',
  ACTIVE_PID: 'mq7_active_profile_id_v2_2',
  REPORTS: 'mq7_exam_reports_v2_2',
  CUSTOM_EXAMS: 'mq7_custom_exams_v2_2',
  DESC_ANSWERS: 'mq7_descriptive_answers_v2_3',
  QUESTION_ISSUES: 'mq7_question_issue_reports_v1'
};

let questionIssueReports = (() => { try { const v = JSON.parse(localStorage.getItem(STORAGE_KEYS.QUESTION_ISSUES) || '[]'); return Array.isArray(v) ? v : []; } catch(e) { return []; } })();
function saveQuestionIssueReports() { localStorage.setItem(STORAGE_KEYS.QUESTION_ISSUES, JSON.stringify(questionIssueReports)); }

function getInitialQuestionBank() {
  const embedded = JSON.parse(document.getElementById('embedded-question-bank').textContent);
  const saved = localStorage.getItem(STORAGE_KEYS.QB);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.questions) && parsed.questions.length >= 40) {
        // بانک جدید با بانک ذخیره‌شده ادغام می‌شود تا سؤال‌های قبلی کاربر حذف نشوند.
        const ids = new Set(parsed.questions.map(q => q.id));
        embedded.questions.forEach(q => {
          if (!ids.has(q.id)) parsed.questions.push(q);
        });
        parsed.meta = { ...(parsed.meta || {}), ...embedded.meta };
        localStorage.setItem(STORAGE_KEYS.QB, JSON.stringify(parsed));
        return parsed;
      }
    } catch (e) {}
  }
  localStorage.setItem(STORAGE_KEYS.QB, JSON.stringify(embedded));
  return embedded;
}

let questionBank = getInitialQuestionBank();

// پرسش‌های تکمیلیِ الگومحور برای افزایش تنوع تمرین و آزمون در هر سه فصل
(function addExtraQuestionBank(){
  const extras = [];
  const F = n => toFa(String(n));
  const add = (id,ch,topic,question,answer,wrong,hint,explanation,diff='medium') => {
    const vals = [...new Set([answer,...wrong])];
    let k=1;
    while(vals.length<4) vals.push(F(13 + vals.length*7 + k++));
    extras.push({
      id, chapter:ch, topic, type:'mcq', difficulty:diff, question,
      options:shuffle(vals).slice(0,4), answer,
      hint, explanation, steps:[explanation],
      visual:{kind:'rule_box',title:topic,formula:answer},
      source:'بانک تمرین تکمیلی', page:null,
      points:diff==='easy'?10:(diff==='hard'?30:20)
    });
  };
  const addPairs = (prefix,topic,pairs,op,calc,hintFn) => pairs.forEach(([a,b],i)=>{
    const ans=calc(a,b);
    add(`${prefix}-${String(i+1).padStart(3,'0')}`,2,topic,
      `حاصل عبارت (${F(a)}) ${op} (${F(b)}) کدام است؟`,F(ans),
      [F(ans+2),F(ans-2),F(-ans)],
      (typeof hintFn === 'function' ? hintFn(a,b) : hintFn),`(${F(a)}) ${op} (${F(b)}) = ${F(ans)}.`,i%3===0?'easy':'medium');
  });
  addPairs('C2-ADD','جمع اعداد صحیح',[[-8,5],[-6,-7],[9,-4],[-3,11],[7,-12],[-9,2],[4,-10],[-5,-5],[12,-8],[-11,6]],'+',(a,b)=>a+b,

  for(let i=1;i<=12;i++){

  for(let i=1;i<=12;i++){

    add(`C3-EQ-${String(i).padStart(3,'0')}`,3,'معادله',
      `جواب معادله ${F(a)}x + ${F(b)} = ${F(c)} کدام است؟`,
      F(x),[F(x+1),F(x-1),F(c-a)],
      `ابتدا ${F(b)} را از دو طرف کم کنید و سپس بر ${F(a)} تقسیم کنید.`,
      `${F(a)}x = ${F(c-b)} ، پس x = ${F(x)}.`,'hard');
  }
  for(let i=1;i<=8;i++){
    const d=i%4+2, n=i+2, ans=d*n;
    add(`C3-PAT-${String(i).padStart(3,'0')}`,3,'الگوهای عددی',
      `در الگوی ${F(d)}، ${F(2*d)}، ${F(3*d)}، ... جمله ${F(n)}ام کدام است؟`,
      F(ans),[F(ans+d),F(ans-1),F(d+n)],
      'جمله nام برابر شماره جمله ضرب‌در عدد ثابت الگو است.',
      `جمله nام برابر ${F(d)}n است؛ با قرار دادن n = ${F(n)}، پاسخ ${F(ans)} می‌شود.`);
  }
  // پرسش‌های تشریحی تکمیلی برای اینکه این بخش نیز فقط به چند سؤال محدود نباشد.
  const desc = [
    ['C2-XD-001',2,'مقایسه اعداد صحیح','اعداد ۸-، ۳+، ۵- و ۰ را از کوچک به بزرگ مرتب کنید.','۸- ، ۵- ، ۰ ، ۳+','اعداد منفی در سمت چپ صفر هستند و عدد دورتر از صفر کوچک‌تر است.'],
    ['C2-XD-002',2,'جمع اعداد صحیح','حاصل (۷-) + (۱۲+) را با توضیح روش محاسبه کنید.','۵+','مقدارها را کم می‌کنیم: ۱۲ − ۷ = ۵؛ چون ۱۲ بزرگ‌تر و مثبت است، پاسخ ۵+ می‌شود.'],
    ['C2-XD-003',2,'تفریق اعداد صحیح','حاصل (۶-) − (۴-) را به کمک تبدیل تفریق به جمع قرینه به دست آورید.','۲-','۶- − (۴-) = ۶- + ۴+ = ۲-.'],
    ['C2-XD-004',2,'ضرب اعداد صحیح','حاصل (۷-) × (۳-) را همراه با قانون علامت‌ها بنویسید.','۲۱+','حاصل‌ضرب دو عدد منفی مثبت است و ۷ × ۳ = ۲۱؛ پس پاسخ ۲۱+ است.'],
    ['C2-XD-005',2,'تقسیم اعداد صحیح','حاصل (۴۸-) ÷ (۶+) را محاسبه و علامت پاسخ را مشخص کنید.','۸-','۴۸ ÷ ۶ = ۸ و چون علامت‌ها مخالف‌اند، پاسخ ۸- است.'],
    ['C2-XD-006',2,'کاربرد اعداد صحیح','دمای هوا ۲ درجه زیر صفر است و سپس ۷ درجه افزایش می‌یابد. دمای جدید را بنویسید.','۵+ درجه','دمای آغازین ۲- است؛ ۲- + ۷+ = ۵+ درجه.'],
    ['C3-XD-001',3,'عبارت جبری','عبارت «۵ واحد کمتر از سه برابر یک عدد» را به صورت جبری بنویسید.','۳x − ۵','سه برابر عدد ۳x است و پنج واحد کمتر از آن یعنی ۳x − ۵.'],
    ['C3-XD-002',3,'جمله‌های متشابه','عبارت ۴a + ۳b − a + ۲b را ساده کنید.','۳a + ۵b','جمله‌های aدار: ۴a − a = ۳a؛ جمله‌های bدار: ۳b + ۲b = ۵b.'],
    ['C3-XD-003',3,'محیط و مساحت با عبارت جبری','محیط مربعی با ضلع x را به صورت عبارت جبری بنویسید.','۴x','مربع چهار ضلع مساوی دارد؛ بنابراین محیط برابر x + x + x + x = ۴x است.'],
    ['C3-XD-004',3,'الگوهای عددی','در الگوی ۳، ۶، ۹، ۱۲، ... جمله دهم را پیدا کنید.','۳۰','جمله nام برابر ۳n است؛ برای n = ۱۰ داریم ۳ × ۱۰ = ۳۰.'],
    ['C3-XD-005',3,'مقدار عددی عبارت جبری','اگر a = ۴ باشد، مقدار ۲a + ۳ را محاسبه کنید.','۱۱','به جای a عدد ۴ قرار می‌دهیم: ۲ × ۴ + ۳ = ۸ + ۳ = ۱۱.'],
    ['C3-XD-006',3,'معادله','معادله x + ۷ = ۱۵ را حل کنید و روش را بنویسید.','x = ۸','از دو طرف ۷ کم می‌کنیم: x = ۱۵ − ۷ = ۸.']
  ];
  desc.forEach(([id,chapter,topic,question,answer,explanation],i)=>extras.push({
    id,chapter,topic,type:'descriptive',difficulty:i%3===0?'easy':'medium',
    question,answer,hint:'ابتدا قانون یا رابطه مربوط به این مبحث را مشخص کنید و سپس مرحله‌به‌مرحله حل کنید.',

  // بانک متنوع و پارامتریک فصل دوم: قرینه، مقایسه، محور، و جمع/تفریق سه عدد دورقمی
  const addRich = (id, topic, question, answer, wrong, hint, explanation, steps, visual, difficulty='medium') => {
    const opts = [...new Set([answer, ...wrong])];
    while (opts.length < 4) opts.push(F(17 + opts.length * 9));

      id, chapter: 2, topic, type: 'mcq', difficulty, question,
      options: shuffle(opts).slice(0,4), answer, hint, explanation, steps,
      visual, source: 'بانک تمرین تکمیلی متنوع', page: null,

    });
  };
  const signed = n => n > 0 ? `+${F(n)}` : n < 0 ? `−${F(Math.abs(n))}` : '۰';
  const paren = n => n < 0 ? `(−${F(Math.abs(n))})` : `(+${F(n)})`;

  // قرینه: ۳۰ سؤال با اعداد مثبت، منفی، صفر و نمایش‌های متنوع
  for (let i=1; i<=30; i++) {
    const n = i===30 ? 0 : (i%2 ? (i%10+1) : -(i%10+1));
    const ans = -n;
    const wrong = [n, ans+2, ans-3].filter(v=>v!==ans).map(signed);
    addRich(`C2-OPP-${String(i).padStart(3,'0')}`, 'قرینه اعداد صحیح',
      `قرینه عدد ${signed(n)} کدام است؟`, signed(ans), wrong,
      'قرینه هر عدد، همان فاصله را در طرف مقابل صفر دارد؛ علامت عوض می‌شود و قرینه صفر خود صفر است.',
      `قرینه ${signed(n)} برابر ${signed(ans)} است؛ زیرا مجموع این دو عدد صفر می‌شود.`,
      [`عدد ${signed(n)} را در نظر می‌گیریم.`,`قرینه در سوی دیگر صفر و با همان فاصله قرار می‌گیرد: ${signed(ans)}.`,`بررسی: ${signed(n)} + (${signed(ans)}) = ۰.`],
      {kind:'numberline', title:`قرینه ${signed(n)} روی محور`, points:[{val:Math.max(-10,Math.min(10,n)),label:signed(n)},{val:0,label:'۰'},{val:Math.max(-10,Math.min(10,ans)),label:signed(ans)}]},
      i%4===0?'easy':'medium');
  }

  // مقایسه: جفت‌های مثبت، منفی، صفر و اعداد هم‌قدر با علامت مخالف
  for (let i=1; i<=36; i++) {
    let a, b;
    switch(i%6) {
      case 0: a=-(i%10+1); b=-(i%7+1); break;
      case 1: a=i%10+1; b=-(i%9+1); break;
      case 2: a=-(i%9+1); b=0; break;
      case 3: a=i%8+1; b=i%8+2; break;
      case 4: a=-(i%7+2); b=-(i%5+1); break;
      default: a=i%9+1; b=-(i%9+1);
    }
    const answer = a>b ? `${signed(a)} > ${signed(b)}` : a<b ? `${signed(a)} < ${signed(b)}` : `${signed(a)} = ${signed(b)}`;
    const wrong = [a>b?`${signed(b)} > ${signed(a)}`:`${signed(a)} > ${signed(b)}`,
      a===b?`${signed(a)} < ${signed(b)}`:`${signed(a)} = ${signed(b)}`,
      `${signed(b)} < ${signed(a)}`].filter(x=>x!==answer);
    addRich(`C2-CMP-${String(i).padStart(3,'0')}`, 'مقایسه اعداد صحیح',
      `علامت مناسب ( < ، > یا = ) را انتخاب کنید: ${signed(a)}  □  ${signed(b)}`,
      answer, wrong,
      'روی محور اعداد، هر عددی که راست‌تر باشد بزرگ‌تر است. بین دو عدد منفی، عددی که قدرمطلق کوچک‌تری دارد بزرگ‌تر است.',
      `${answer}؛ چون جایگاه این دو عدد روی محور به همین ترتیب است.`,
      [`ابتدا جایگاه دو عدد را نسبت به صفر مشخص می‌کنیم.`,`عدد راست‌تر بزرگ‌تر است؛ بنابراین ${answer}.`],
      {kind:'numberline',title:`مقایسه ${signed(a)} و ${signed(b)} روی محور`,points:[{val:Math.max(-10,Math.min(10,a)),label:signed(a)},{val:0,label:'۰'},{val:Math.max(-10,Math.min(10,b)),label:signed(b)}]},
      i%3===0?'easy':'medium');
  }

  // جمع و تفریق دو عدد با حرکت گام‌به‌گام روی همان محور انیمیشنی موجود
  for (let i=1; i<=32; i++) {
    let a = (i*3)%11-5, b = (i*5)%11-5;
    if (a===0) a=4; if (b===0) b=-3;
    const isSub = i%2===0;
    const movement = isSub ? -b : b;
    const result = a + movement;
    const topic = isSub ? 'تفریق اعداد صحیح' : 'جمع اعداد صحیح';
    const op = isSub ? ' − ' : ' + ';
    const answer = signed(result);
    const converted = isSub ? `${paren(a)} − ${paren(b)} = ${paren(a)} + ${paren(-b)}` : `${paren(a)} + ${paren(b)}`;
    addRich(`C2-AXIS-${String(i).padStart(3,'0')}`, topic,
      `حاصل ${paren(a)} ${op} ${paren(b)} با کمک محور اعداد کدام است؟`,
      answer, [signed(result+2),signed(result-2),signed(-result)],
      isSub ? 'تفریق را به جمع قرینه عدد دوم تبدیل کنید؛ سپس از صفر به عدد اول و از آنجا به اندازه عدد دومِ تبدیل‌شده حرکت کنید.' : 'از صفر به اندازه عدد اول حرکت کنید؛ سپس از نقطه پایان، به اندازه عدد دوم و در جهت علامت آن حرکت کنید.',
      `${converted} = ${answer}.`,
      isSub ? [`تبدیل تفریق به جمع قرینه: ${converted}.`,`حرکت اول: از صفر تا ${signed(a)}.`,`حرکت دوم: به اندازه ${signed(-b)} حرکت می‌کنیم و به ${answer} می‌رسیم.`] : [`حرکت اول: از صفر تا ${signed(a)}.`,`حرکت دوم: از ${signed(a)} به اندازه ${signed(b)} حرکت می‌کنیم.`,`نقطه پایان ${answer} است.`],
      {kind:'move_line',title:`نمایش گام‌به‌گام ${converted} = ${answer}`,first:a,second:movement,end:result},
      i%4===0?'easy':'medium');
  }

  // سه عدد صحیح دورقمی با علامت‌های مثبت و منفی؛ جدول دهگان/یکان و شرح حل
  for (let i=1; i<=48; i++) {
    const raw = [
      10 + ((i*7)%39),
      10 + ((i*11+5)%39),
      10 + ((i*13+9)%39)
    ];
    const nums = raw.map((n,j) => ((i+j*2)%3===0 ? -n : n));
    const isSub = i%2===0;
    const terms = isSub ? [nums[0], -nums[1], nums[2]] : nums;
    const result = terms.reduce((a,b)=>a+b,0);
    const expr = isSub ? `${paren(nums[0])} − ${paren(nums[1])} + ${paren(nums[2])}` : nums.map(paren).join(' + ');
    const shownTerms = terms.map(paren).join(' + ');
    const topic = isSub ? 'تفریق اعداد صحیح' : 'جمع اعداد صحیح';
    const answer = signed(result);
    const positiveTotal = terms.filter(n=>n>0).reduce((a,b)=>a+b,0);
    const negativeMagnitude = -terms.filter(n=>n<0).reduce((a,b)=>a+b,0);
    const explanation = `${expr} = ${shownTerms}. مجموع عددهای مثبت: ${signed(positiveTotal)}؛ مجموع قدرمطلق عددهای منفی: ${F(negativeMagnitude)}. بنابراین ${F(positiveTotal)} − ${F(negativeMagnitude)} = ${answer}.`;
    addRich(`C2-COL-${String(i).padStart(3,'0')}`,topic,
      `حاصل عبارت سه‌عددی ${expr} کدام است؟`,
      answer,[signed(result+10),signed(result-10),signed(-result)],
      'برای حل، عددها را در جدول دهگان و یکان بررسی کنید. در تفریق، ابتدا آن را به جمع قرینه تبدیل کنید؛ سپس مجموع مثبت‌ها و قدرمطلق مجموع منفی‌ها را جداگانه به دست آورید.',
      explanation,
      [`در جدول، دهگان و یکان هر عدد را مشخص می‌کنیم؛ میله‌ها دهگان و دایره‌ها یکان را نشان می‌دهند.`,`تبدیل عبارت به جمع: ${shownTerms}.`,`مجموع عددهای مثبت برابر ${F(positiveTotal)} است.`,`مجموع قدرمطلق عددهای منفی برابر ${F(negativeMagnitude)} است.`,`تفاضل دو مجموع با علامت مناسب: ${F(positiveTotal)} − ${F(negativeMagnitude)} = ${answer}.`],
      {kind:'signed_columns',title:'جدول ارزش مکانی دهگان و یکانِ سه عدد صحیح',operands:terms},
      i%4===0?'hard':'medium');
  }

  const ids=new Set(questionBank.questions.map(q=>q.id));
  extras.forEach(q=>{if(!ids.has(q.id)) questionBank.questions.push(q);});
  saveQuestionBank();
})();

// انتخاب تصادفی خودکار بدون تکرار هنگام ورود مجدد به هر بخش
let recentlyShownIds = [];
function pickRandomNonRepeating(pool, count) {
  const fresh = pool.filter(q => !recentlyShownIds.includes(q.id));
  const secondary = pool.filter(q => recentlyShownIds.includes(q.id));
  const combined = [...shuffle(fresh), ...shuffle(secondary)].slice(0, Math.min(count, pool.length));
  combined.forEach(q => {
    recentlyShownIds.push(q.id);
    if (recentlyShownIds.length > 22) recentlyShownIds.shift();
  });
  return combined;
}

    progress = found;
    activeProfileId = pid;
    localStorage.setItem(STORAGE_KEYS.ACTIVE_PID, pid);
    renderTopBar();
    render();
  }
}

function playTone(type) {
  if (!progress.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'ok') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.09);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } else {
      osc.frequency.setValueAtTime(240, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }
  } catch (e) {}
}

let currentRoute = 'home';
let routeParams = {};

function navigate(route, params = {}) {
  currentRoute = route;
  routeParams = params;
  // هر بار ورود مجدد به تمرین یا تشریحی، انتخاب تصادفی جدید انجام شود
  if (route === 'practice') {
    practiceState.pool = [];
    practiceState.poolSignature = '';
    practiceState.index = 0;
    practiceState.showHint = false;
    practiceState.showSteps = false;
    practiceState.sessionSeed = Date.now();
  }
  if (route === 'descriptive') {
    descState.pool = [];
    descState.poolSignature = '';
    descState.index = 0;
    descState.showSolution = false;
    descState.sessionSeed = Date.now();
  }
  if (route === 'trueFalsePractice') {
    tfPracticeState.pool = []; tfPracticeState.seenSignature = '';
    tfPracticeState.index = 0; tfPracticeState.selected = null; tfPracticeState.submitted = false;
  }
  if (route === 'fillBlankPractice') {
    fillPracticeState.pool = []; fillPracticeState.seenSignature = '';
    fillPracticeState.index = 0; fillPracticeState.selected = null; fillPracticeState.submitted = false;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

}

function chLabel(c) {
  const names = {1:'راهبردهای حل مسئله',2:'عددهای صحیح',3:'جبر و معادله'};
  return `<span class="badge badge-ch">فصل ${toFa(c)}: ${names[Number(c)] || ''}</span>`;
}
function isObjectiveQuestion(q) {
  return !!q && q.type !== 'descriptive';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let tfPracticeState = { chapter: 'all', pool: [], index: 0, selected: null, submitted: false, seenSignature: '' };
let fillPracticeState = { chapter: 'all', pool: [], index: 0, selected: null, submitted: false, seenSignature: '' };
function resetSpecialPool(state, type) {
  const pool = questionBank.questions.filter(q => q.type === type && (state.chapter === 'all' || String(q.chapter) === state.chapter));
  const signature = `${state.chapter}|${type}|${pool.length}`;
  if (!state.pool.length || state.seenSignature !== signature || state.index >= state.pool.length) {
    state.pool = pickRandomNonRepeating(pool, pool.length);
    state.index = 0; state.selected = null; state.submitted = false; state.seenSignature = signature;
  }
  return state.pool;
}
function renderSpecialChapterSelect(state, prefix) {
  return `<select style="width:auto;" onchange="${prefix}.chapter=this.value; ${prefix}.pool=[]; ${prefix}.seenSignature=''; render();">
    <option value="all" ${state.chapter==='all'?'selected':''}>همه فصل‌ها</option>
    <option value="1" ${state.chapter==='1'?'selected':''}>فصل اول</option>
    <option value="2" ${state.chapter==='2'?'selected':''}>فصل دوم</option>
    <option value="3" ${state.chapter==='3'?'selected':''}>فصل سوم</option></select>`;
}
function renderTrueFalsePractice() {
  setMascot('هر گزاره را با دقت بخوان؛ درست یا نادرست بودن آن را مشخص کن و توضیح پاسخ را یاد بگیر.');
  const list = resetSpecialPool(tfPracticeState, 'truefalse'), q = list[tfPracticeState.index];
  return `<div class="section-header"><h2>✅❌ تمرین مستقل درست و نادرست</h2><div style="display:flex;gap:8px;flex-wrap:wrap;">${renderSpecialChapterSelect(tfPracticeState,'tfPracticeState')}<button class="btn btn-outline btn-sm" onclick="navigate('home')">بازگشت</button></div></div>
  ${q ? `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><strong>${chLabel(q.chapter)} | ${q.topic}</strong><span class="badge badge-ch">گزاره ${toFa(tfPracticeState.index+1)} از ${toFa(list.length)}</span></div>
  <div style="font-size:1.15rem;font-weight:800;margin:20px 0;">${formatMathText(q.question)}</div>
  <div class="tf-grid"><button class="tf-btn true-opt ${tfPracticeState.selected==='درست'?'selected':''}" ${tfPracticeState.submitted?'disabled':''} onclick="tfPracticeState.selected='درست';render();">✅ درست</button><button class="tf-btn false-opt ${tfPracticeState.selected==='نادرست'?'selected':''}" ${tfPracticeState.submitted?'disabled':''} onclick="tfPracticeState.selected='نادرست';render();">❌ نادرست</button></div>
  ${tfPracticeState.submitted ? `<div class="feedback-box ${tfPracticeState.selected===q.answer?'ok':'err'}"><strong>${tfPracticeState.selected===q.answer?'آفرین! پاسخ درست است.':'پاسخ درست: '+q.answer}</strong><p>${formatMathText(q.explanation||q.hint||'')}</p></div>`:''}
  <div style="margin-top:12px;">${!tfPracticeState.submitted?`<button class="btn btn-primary" onclick="submitSpecialAnswer('tf')">ثبت پاسخ</button>`:`<button class="btn btn-success" onclick="nextSpecialQuestion('tf')">${tfPracticeState.index+1<list.length?'گزاره بعدی':'شروع دور تازه'}</button>`}</div></div>`:`<div class="card">برای این فصل هنوز گزاره‌ای ثبت نشده است.</div>`}`;
}
function renderFillBlankPractice() {
  setMascot('جای خالی را با گزینه درست کامل کن؛ بعد از پاسخ، راه‌حل و توضیح را ببین.');
  const list = resetSpecialPool(fillPracticeState, 'fill'), q = list[fillPracticeState.index];
  return `<div class="section-header"><h2>🔲 تمرین مستقل جای خالی</h2><div style="display:flex;gap:8px;flex-wrap:wrap;">${renderSpecialChapterSelect(fillPracticeState,'fillPracticeState')}<button class="btn btn-outline btn-sm" onclick="navigate('home')">بازگشت</button></div></div>
  ${q ? `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><strong>${chLabel(q.chapter)} | ${q.topic}</strong><span class="badge badge-ch">سؤال ${toFa(fillPracticeState.index+1)} از ${toFa(list.length)}</span></div>
  <div style="font-size:1.15rem;font-weight:800;margin:20px 0;">${formatMathText(q.question)}</div><div class="options-list">
  ${(q.options||[]).map((opt,i)=>`<button class="option-btn ${fillPracticeState.selected===opt?'selected':''} ${fillPracticeState.submitted?(opt===q.answer?'correct':(opt===fillPracticeState.selected?'wrong':'')):''}" ${fillPracticeState.submitted?'disabled':''} onclick="selectSpecialOption('fill', ${i});"><span class="opt-letter">${['الف','ب','ج','د'][i]}</span>${formatMathText(opt)}</button>`).join('')}</div>
  ${fillPracticeState.submitted?`<div class="feedback-box ${fillPracticeState.selected===q.answer?'ok':'err'}"><strong>${fillPracticeState.selected===q.answer?'آفرین! پاسخ درست است.':'پاسخ درست: '+formatMathText(q.answer)}</strong><p>${formatMathText(q.explanation||q.hint||'')}</p></div>`:''}
  <div style="margin-top:12px;">${!fillPracticeState.submitted?`<button class="btn btn-primary" onclick="submitSpecialAnswer('fill')">ثبت پاسخ</button>`:`<button class="btn btn-success" onclick="nextSpecialQuestion('fill')">${fillPracticeState.index+1<list.length?'سؤال بعدی':'شروع دور تازه'}</button>`}</div></div>`:`<div class="card">برای این فصل هنوز سؤالی ثبت نشده است.</div>`}`;
}
function selectSpecialOption(kind, index) {
  const state = kind === 'tf' ? tfPracticeState : fillPracticeState;
  const q = state.pool[state.index];
  if (!q || state.submitted || !Array.isArray(q.options) || index < 0 || index >= q.options.length) return;
  state.selected = q.options[index];
  render();
}
function submitSpecialAnswer(kind) {
  const state = kind==='tf'?tfPracticeState:fillPracticeState, q = state.pool[state.index];
  if (!state.selected) { alert('ابتدا پاسخ خود را انتخاب کنید.'); return; }
  state.submitted = true;
  if (state.selected===q.answer) { progress.points+=10; progress.stars+=1; playTone('ok'); } else playTone('err');
  saveProgress(); render();
}
function nextSpecialQuestion(kind) {
  const state = kind==='tf'?tfPracticeState:fillPracticeState;
  if (state.index+1>=state.pool.length) { state.pool=[]; state.seenSignature=''; }
  else state.index++;
  state.selected=null; state.submitted=false; render();
}

function checkAndAwardBadges() {
  const m1Done = ['M1-1','M1-2','M1-3'].every(id => progress.completedMissions.includes(id));
  const m2Done = ['M2-1','M2-2','M2-3'].every(id => progress.completedMissions.includes(id));
  const m3Done = ['M3-1','M3-2','M3-3'].every(id => progress.completedMissions.includes(id));
  if (m1Done && !progress.badges.includes('B-CH1')) progress.badges.push('B-CH1');
  if (m2Done && !progress.badges.includes('B-CH2')) progress.badges.push('B-CH2');
  if (m3Done && !progress.badges.includes('B-CH3')) progress.badges.push('B-CH3');
  if (progress.points >= 100 && !progress.badges.includes('B-100')) progress.badges.push('B-100');
  if (m1Done && m2Done && m3Done && !progress.badges.includes('B-HERO')) progress.badges.push('B-HERO');
}

function startMission(missionId) {
  const mission = ADVENTURE_STAGES.find(m => m.id === missionId);
  const pool = questionBank.questions.filter(q => isObjectiveQuestion(q) && q.chapter === mission.chapter && mission.topics.includes(q.topic));
  const selected = pickRandomNonRepeating(pool, Math.min(6, pool.length));
  startQuizSession({ title: `مأموریت: ${mission.title}`, questions: selected, timed: false, missionId: mission.id });
}

function launchConfiguredQuiz(isCustom) {
  const ch = document.getElementById('cfgChapter').value;
  const topic = document.getElementById('cfgTopic').value;
  const diff = document.getElementById('cfgDiff').value;
  const count = Number(document.getElementById('cfgCount').value);
  const timed = document.getElementById('cfgTimed').value === 'yes';
  const qType = isCustom ? document.getElementById('cfgType').value : 'mcq';

  let pool = questionBank.questions.filter(q => {
    if (ch !== 'all' && String(q.chapter) !== ch) return false;
    if (topic !== 'all' && q.topic !== topic) return false;
    if (diff !== 'all' && q.difficulty !== diff) return false;
    if (qType === 'mcq' && q.type !== 'mcq') return false;
    if (qType === 'truefalse' && q.type !== 'truefalse') return false;
    if (qType === 'descriptive' && q.type !== 'descriptive') return false;
    return true;
  });

  if (pool.length === 0) {
    alert('با فیلترهای انتخاب‌شده سؤالی یافت نشد! تنظیمات را گسترده‌تر کنید.');
    return;
  }

  const selected = pickRandomNonRepeating(pool, Math.min(count, pool.length));
  startQuizSession({
    title: isCustom ? 'آزمون اختصاصی دانش‌آموز' : 'مسابقه چهارگزینه‌ای و درست/نادرست',
    questions: selected,
    timed,
    timeLimitSec: timed ? selected.length * 60 : 0
  });
}

function startTeacherExam(idx) {
  const ex = customExams[idx];
  const qs = ex.questionIds.map(id => questionBank.questions.find(q => q.id === id)).filter(Boolean);
  startQuizSession({ title: ex.title, questions: qs, timed: ex.duration > 0, timeLimitSec: ex.duration * 60 });
}

function updateMpPlayerInputs(cnt) {
  const existing = [...document.querySelectorAll('.mp-name-input')].map(i => i.value);
  const avs = ['🦄', '🦁', '🐼', '🚀'];
  mpState.players = Array.from({ length: cnt }, (_, i) => ({
    name: existing[i] || `بازیکن ${toFa(i + 1)}`,
    avatar: avs[i % avs.length],
    score: 0,
    correct: 0
  }));
  render();
}

function startMultiplayerMatch() {
  const nameInputs = [...document.querySelectorAll('.mp-name-input')];
  mpState.players = nameInputs.map((inp, i) => ({
    name: inp.value.trim() || `بازیکن ${toFa(i + 1)}`,
    avatar: mpState.players[i]?.avatar || '🦊',
    score: 0,
    correct: 0
  }));
  const ch = document.getElementById('mpCh').value;
  const qCount = Number(document.getElementById('mpQCount').value);
  const pool = questionBank.questions.filter(q => isObjectiveQuestion(q) && (ch === 'all' || String(q.chapter) === ch));
  mpState.questions = pickRandomNonRepeating(pool, Math.min(qCount, pool.length));
  mpState.qIndex = 0;
  mpState.turnIdx = 0;
  mpState.lastFeedback = '';
  mpState.phase = 'playing';
  render();
}

function submitMpAnswer(chosen) {
  const q = mpState.questions[mpState.qIndex];
  const p = mpState.players[mpState.turnIdx];
  const ok = chosen === q.answer;
  if (ok) {
    p.score += q.points;
    p.correct += 1;
    playTone('ok');
    mpState.lastFeedback = `✅ ${p.name} درست پاسخ داد (+${toFa(q.points)} امتیاز)! ${formatMathText(q.explanation)}`;
  } else {
    playTone('err');
    mpState.lastFeedback = `❌ پاسخ ${p.name} نادرست بود. پاسخ صحیح: ${formatMathText(q.answer)} — ${formatMathText(q.explanation)}`;
  }

  mpState.turnIdx = (mpState.turnIdx + 1) % mpState.players.length;
  if (mpState.qIndex + 1 < mpState.questions.length) {
    mpState.qIndex++;
    render();
  } else {
    mpState.phase = 'finished';
    render();
  }
}

function setupTempStage(st) {
  gameState.tempStage = st;
  gameState.tempMsg = '';
  if (st === 1) {
    const arr = [-5, -3, -2, 3, 4, 6];
    gameState.tempTarget = arr[Math.floor(Math.random() * arr.length)];
    gameState.tempCurrent = 0;
    gameState.tempMovesLeft = 5;
  } else if (st === 2) {
    const starts = [-4, 2, -2, 5];
    const targets = [-9, -6, 7, 8];
    gameState.tempCurrent = starts[Math.floor(Math.random() * starts.length)];
    gameState.tempTarget = targets[Math.floor(Math.random() * targets.length)];
    if (gameState.tempCurrent === gameState.tempTarget) gameState.tempTarget -= 4;
    gameState.tempMovesLeft = 4;
  } else {
    const starts = [-7, 6, -8, 9];
    const targets = [5, -6, 4, -5];
    gameState.tempCurrent = starts[Math.floor(Math.random() * starts.length)];
    gameState.tempTarget = targets[Math.floor(Math.random() * targets.length)];
    gameState.tempMovesLeft = 3;
  }
}

function setupAlgStage(st) {
  gameState.algStage = st;
  gameState.algMsg = '';
  const stagesBank = {
    1: [
      { expr: '-(+(-۷))', ans: '+۷', opts: ['+۷', '-۷', '۰', '-۱۴'] },
      { expr: '-(-(-۵))', ans: '-۵', opts: ['-۵', '+۵', '۰', '-۱۵'] },
      { expr: '۳x + ۲x', ans: '۵x', opts: ['۵x', '۶x', 'x', '۵'] },
      { expr: '۷a - ۳a', ans: '۴a', opts: ['۴a', '۱۰a', '۴', '-۴a'] }
    ],
    2: [
      { expr: '۵a + ۳b - ۲a + b', ans: '۳a + ۴b', opts: ['۳a + ۴b', '۷a + ۲b', '۳a + ۲b', '۸ab'] },
      { expr: '۴(x + ۲)', ans: '۴x + ۸', opts: ['۴x + ۸', '۴x + ۲', 'x + ۸', '۴x + ۶'] },
      { expr: '-(۳x - ۵y)', ans: '-۳x + ۵y', opts: ['-۳x + ۵y', '-۳x - ۵y', '۳x + ۵y', '-۳x + ۱۵y'] }
    ],
    3: [
      { expr: '۳(۲x - ۱) + ۲x', ans: '۸x - ۳', opts: ['۸x - ۳', '۶x - ۱', '۸x - ۱', '۵x - ۳'] },
      { expr: '(۳x - ۸) - (۳x + ۷)', ans: '-۱۵', opts: ['-۱۵', '-۱', '۶x - ۱۵', '+۱۵'] },
      { expr: '۲(y + x) - (x - y)', ans: 'x + ۳y', opts: ['x + ۳y', 'x + y', '۳x + y', 'x - ۳y'] }
    ]
  };
  const list = stagesBank[st];
  const pick = list[Math.floor(Math.random() * list.length)];
  gameState.algExpr = pick.expr;
  gameState.algTarget = pick.ans;
  gameState.algOptions = shuffle(pick.opts);
}

function setupEqStage(st) {
  gameState.eqStage = st;
  gameState.eqMsg = '';
  if (st === 1) {
    const x = Math.floor(Math.random() * 6) + 2;
    const b = Math.floor(Math.random() * 7) + 1;
    gameState.eqX = x;
    gameState.eqText = `x + ${toFa(b)} = ${toFa(x + b)}`;
    gameState.eqHint = `از دو طرف عدد ${toFa(b)} را کم کن.`;
  } else if (st === 2) {
    const a = Math.floor(Math.random() * 3) + 2;
    const x = Math.floor(Math.random() * 5) + 2;
    const b = Math.floor(Math.random() * 5) + 1;
    gameState.eqX = x;
    gameState.eqText = `${toFa(a)}x - ${toFa(b)} = ${toFa(a * x - b)}`;
    gameState.eqHint = `ابتدا ${toFa(b)} را به دو طرف اضافه کن، سپس بر ${toFa(a)} تقسیم کن.`;
  } else {
    const x = Math.floor(Math.random() * 4) + 2;
    const c = Math.floor(Math.random() * 4) + 1;
    gameState.eqX = x;
    gameState.eqText = `۳x - ${toFa(c)} = x + ${toFa(2 * x - c)}`;
    gameState.eqHint = `ابتدا از دو طرف معادله x کم کن تا ۲x - ${toFa(c)} = ${toFa(2 * x - c)} شود.`;
  }
}
