<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --secondary: #0ea5e9;
      --accent: #f59e0b;
      --success: #10b981;
      --success-bg: #d1fae5;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 50%, #fefce8 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.65;
      overflow-x: hidden;

    /* ایزوله‌سازی کامل اعداد علامت‌دار، قرینه‌ها -(+(−۷)) و عبارت‌های ریاضی */
    .math, .num-ltr {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
      font-weight: 800;
      background: rgba(79, 70, 229, 0.08);
      padding: 1px 8px;
      border-radius: 7px;
      color: #1e1b4b;
      margin: 0 3px;
      letter-spacing: 0.2px;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.28); }
      50% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
    }
    @keyframes popBounce {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes drawArc {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    .anim-float { animation: floatSlow 3.4s ease-in-out infinite; }
    .anim-pulse { animation: pulseGlow 2.4s infinite; }
    .anim-pop { animation: popBounce 0.38s ease-out; }
    .arc-animated {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: drawArc 0.85s ease-out forwards;
    }

    .floating-math-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.14;
    }
    .float-symbol {
      position: absolute;
      font-size: 1.6rem;
      font-weight: 900;
      color: #4338ca;
      direction: ltr;
      animation: floatSlow 5s ease-in-out infinite;
    }

      background: linear-gradient(90deg, #312e81, #4338ca, #0369a1);

      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 18px rgba(30, 27, 75, 0.25);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

    .brand {
      display: flex;

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #1e1b4b;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .brand h1 { margin: 0; font-size: 1.12rem; font-weight: 900; }
    .brand small { display: block; font-size: 0.76rem; color: #c7d2fe; }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .stat-pill {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.24);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill button {
      background: rgba(255,255,255,0.22);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 2px 7px;
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 700;
    }
    .stat-pill button:hover { background: rgba(255,255,255,0.36); }
    .container {
      max-width: 1240px;
      margin: 20px auto;
      padding: 0 16px 60px;
      position: relative;
      z-index: 1;
    }
    .mascot-banner {
      background: #fff;
      border: 2px solid #c7d2fe;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
    }
    .mascot-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0e7ff, #bae6fd);
      display: grid;
      place-items: center;
      font-size: 30px;
      flex-shrink: 0;
      border: 2px solid var(--primary);
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .menu-card {
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .menu-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }
    .menu-icon {
      font-size: 1.9rem;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
    }
    .menu-card h3 { margin: 2px 0 0; font-size: 1.04rem; font-weight: 800; }
    .menu-card p { margin: 0; font-size: 0.86rem; color: var(--muted); }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
    }
    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
    }
    .section-header h2 { margin: 0; font-size: 1.25rem; color: var(--primary-dark); }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: var(--secondary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--accent); color: #1e1b4b; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; border-radius: 9px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    label.field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    select, input[type="text"], input[type="number"], input[type="password"], textarea {

      border-radius: 10px;
      border: 2px solid var(--border);
      font-size: 0.92rem;
      background: #fff;
      width: 100%;
    }
    .badge {

      border-radius: 999px;
      font-size: 0.78rem;

    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-hard { background: #fee2e2; color: #991b1b; }
    .badge-ch { background: #e0e7ff; color: #3730a3; }
    .progress-wrap {
      background: #e2e8f0;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }
    .options-list {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }
    .option-btn {
      text-align: right;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.15s;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #eef2ff; }
    .option-btn.selected { border-color: var(--primary); background: #e0e7ff; }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #065f46; }
    .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #991b1b; }
    .opt-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid currentColor;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
      border-right: 5px solid var(--primary);
      background: #f8fafc;
    }
    .feedback-box.ok { border-right-color: var(--success); background: #ecfdf5; }
    .feedback-box.err { border-right-color: var(--danger); background: #fef2f2; }
    .visual-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      padding: 14px;
      margin: 12px 0;
      text-align: center;
    }
    .visual-card svg {
      max-width: 100%;
      height: auto;
      direction: ltr;
    }
    .axis-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .axis-step-badge {
      background: #e0e7ff;
      color: #312e81;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }
    .realms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .realm-card {
      border-radius: 18px;
      padding: 20px;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .realm-2 { background: linear-gradient(135deg, #1d4ed8, #0284c7); }
    .realm-3 { background: linear-gradient(135deg, #6d28d9, #db2777); }
    .stage-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .stage-item {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: right;
    }
    table.data-table th { background: #f1f5f9; font-weight: 800; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .medal {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;

      border-color: #cbd5e1;
      color: #94a3b8;

    .mini-game-arena {
      background: linear-gradient(135deg, #fff1f2 0%, #fefce8 35%, #ecfdf5 70%, #eff6ff 100%);

      box-shadow: 0 14px 30px -8px rgba(79, 70, 229, 0.18);

    .game-hud {

      cursor: pointer;

    .avatar-grid {

      gap: 10px;
      margin: 10px 0;
    }
    .avatar-choice {
      font-size: 2rem;
      padding: 10px;
      border-radius: 16px;
      border: 2px solid var(--border);

      text-align: center;
      transition: 0.16s;
    }
    .avatar-choice:hover { transform: scale(1.08); border-color: var(--primary); }

      border-color: #f59e0b;
      background: linear-gradient(135deg, #fef3c7, #e0e7ff);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);

    }
    .profile-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      margin-bottom: 10px;
    }
    .profile-card-item.active-prof {
      border-color: var(--primary);
      background: #eef2ff;
    }
    .score-board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
    .player-card {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
    }
    .player-card.active-turn {
      border-color: var(--primary);
      background: #eef2ff;
    }
    @media print {
      header.topbar, .mascot-banner, .floating-math-bg, .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #999; }
    }
  .math{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;text-align:left}
</style>
</head>

<script>
// ==================== ۱. تبدیل کامل تمام اعداد به فارسی (بدون هیچ رقم انگلیسی) ====================
const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(val) {
  if (val === null || val === undefined) return '';
  return String(val).replace(/[0-9]/g, d => FA_DIGITS[Number(d)]);
}

// ==================== ۲. اصلاح کامل نمایش قرینه و پرانتزها با منفی در سمت چپ -(+(−۷)) ====================
function formatMathText(text) {
  if (!text) return '';
  let safe = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // الگوهای جامع شامل: قرینه‌های تو در تو مثل -(-(+۷)) و -(+(-۷))، کروشه، پرانتز، معادلات و اعداد علامت‌دار
  const mathRegex = /(?:[+\-−]?\s*(?:[0-9۰-۹]+[a-zA-Z]+|[a-zA-Z]+[0-9۰-۹]*|[0-9۰-۹]+|\([^()]*\))(?:\s*(?:[+\-−×÷*/=<>≤≥⇒])\s*[+\-−]?\s*(?:[0-9۰-۹]+[a-zA-Z]+|[a-zA-Z]+[0-9۰-۹]*|[0-9۰-۹]+|\([^()]*\)))+|[+\-−]\s*\(?[0-9۰-۹]+\)?)/g;
  safe = safe.replace(mathRegex, match => `<span class="math" dir="ltr" style="direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap">${toFa(match).replace(/-/g,'−')}</span>`);
  return toFa(safe).replace(/\n/g, '<br>');
}

// ==================== ۳. محور اعداد گام‌به‌گام با فلش قوسی اول، فلش قوسی دوم و پخش مجدد ====================
let axisAnimState = {}; // نگه‌داری مرحله فعلی هر محور با شناسه یکتا

function playAxisStepByStep(uid) {
  if (!axisAnimState[uid]) axisAnimState[uid] = { step: 1, timers: [] };
  axisAnimState[uid].timers.forEach(t => clearTimeout(t));
  axisAnimState[uid].timers = [];
  axisAnimState[uid].step = 1;
  updateAxisDOM(uid);

  const t1 = setTimeout(() => {
    if (!axisAnimState[uid]) return;
    axisAnimState[uid].step = 2;
    updateAxisDOM(uid);
  }, 1100);

  const t2 = setTimeout(() => {
    if (!axisAnimState[uid]) return;
    axisAnimState[uid].step = 3;
    updateAxisDOM(uid);
  }, 2300);

  axisAnimState[uid].timers.push(t1, t2);
}

function setAxisManualStep(uid, stepNum) {
  if (!axisAnimState[uid]) axisAnimState[uid] = { step: stepNum, timers: [] };
  axisAnimState[uid].timers.forEach(t => clearTimeout(t));
  axisAnimState[uid].timers = [];
  axisAnimState[uid].step = stepNum;
  updateAxisDOM(uid);
}

function updateAxisDOM(uid) {
  const wrap = document.getElementById('axis-wrap-' + uid);
  if (!wrap) return;
  const step = axisAnimState[uid] ? axisAnimState[uid].step : 3;
  const arc1 = wrap.querySelector('.axis-arc-1');
  const arc2 = wrap.querySelector('.axis-arc-2');
  const badge = wrap.querySelector('.axis-step-badge');

  if (arc1) {
    arc1.style.display = step >= 2 ? 'inline' : 'none';
    if (step === 2) {
      arc1.classList.remove('arc-animated');
      void arc1.offsetWidth;
      arc1.classList.add('arc-animated');
    }
  }
  if (arc2) {
    arc2.style.display = step >= 3 ? 'inline' : 'none';
    if (step === 3) {
      arc2.classList.remove('arc-animated');
      void arc2.offsetWidth;
      arc2.classList.add('arc-animated');
    }
  }
  if (badge) {
    if (step === 1) badge.textContent = 'گام ۱ از ۳: نمایش محور و مبدأ (۰)';
    else if (step === 2) badge.textContent = 'گام ۲ از ۳: فلش قوسی حرکت عدد اول';
    else badge.textContent = 'گام ۳ از ۳: فلش قوسی عدد دوم و نقطه پایان';
  }
}

function renderVisualSVG(vis) {
  if (!vis) return '';
  if (vis.kind === 'numberline') {
    const pts = vis.points || [];
    const minV = -10, maxV = 10;
    const xOf = v => 50 + ((Math.max(minV, Math.min(maxV, v)) - minV) / (maxV - minV)) * 460;
    return `
      <div class="visual-card">
        <div style="font-size:0.86rem; font-weight:800; margin-bottom:6px; color:var(--primary-dark);">${toFa(vis.title || 'نمایش روی محور اعداد')}</div>
        <svg viewBox="0 0 560 100" width="560" height="100">
          <line x1="25" y1="45" x2="535" y2="45" stroke="#334155" stroke-width="2.5" />
          <polygon points="535,45 525,39 525,51" fill="#334155" />
          <polygon points="25,45 35,39 35,51" fill="#334155" />
          ${Array.from({length:21}, (_,i) => {
            const v=i-10, tx=xOf(v);
            return `<line x1="${tx}" y1="40" x2="${tx}" y2="50" stroke="#94a3b8" stroke-width="1" />
              <text x="${tx}" y="88" text-anchor="middle" font-size="9" fill="#64748b">${toFa(v)}</text>`;
          }).join('')}
          ${pts.map(p => {
            const cx = xOf(p.val);
            const col = p.val < 0 ? '#dc2626' : (p.val > 0 ? '#16a34a' : '#2563eb');
            return `
              <circle cx="${cx}" cy="45" r="7" fill="${col}" />
              <text x="${cx}" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="${col}">${toFa(p.label || p.val)}</text>
              <text x="${cx}" y="74" text-anchor="middle" font-size="11" fill="#475569">${p.val < 0 ? 'منفی' : (p.val > 0 ? 'مثبت' : 'مبدأ')}</text>
            `;
          }).join('')}
        </svg>
      </div>
    `;
  }

  if (vis.kind === 'move_line') {
    const uid = 'ax_' + Math.random().toString(36).slice(2, 9);
    const first = vis.first !== undefined ? vis.first : vis.start;
    const second = vis.second !== undefined ? vis.second : vis.move;
    const end = vis.end !== undefined ? vis.end : (first + second);

    // محور استاندارد از ۱۰- تا ۱۰+ با فاصله‌های مساوی
    const minV = -10, maxV = 10;
    const xOf = v => 48 + ((Math.max(minV, Math.min(maxV, v)) - minV) / (maxV - minV)) * 464;
    const x0 = xOf(0);
    const x1 = xOf(first);
    const x2 = xOf(end);

    const col1 = first >= 0 ? '#2563eb' : '#e11d48';
    const col2 = second >= 0 ? '#16a34a' : '#d97706';

    // محاسبه مختصات قوس اول (از ۰ به عدد اول) و قوس دوم (از عدد اول به عدد دوم/نهایی)
    const mid1X = (x0 + x1) / 2;
    const ctrl1Y = 26;
    const mid2X = (x1 + x2) / 2;
    const ctrl2Y = 12;

    // جهت سر فلش قوس اول و دوم
    const dir1 = x1 >= x0 ? 1 : -1;
    const dir2 = x2 >= x1 ? 1 : -1;

    setTimeout(() => playAxisStepByStep(uid), 60);

    return `

const STORAGE_KEYS = {

  DESC_ANSWERS: 'mq7_descriptive_answers_v2_3'
};

function getInitialQuestionBank() {
  const saved = localStorage.getItem(STORAGE_KEYS.QB);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && Array.isArray(parsed.questions) && parsed.questions.length >= 40) return parsed;
    } catch (e) {}
  }
  const embedded = JSON.parse(document.getElementById('embedded-question-bank').textContent);
  localStorage.setItem(STORAGE_KEYS.QB, JSON.stringify(embedded));
  return embedded;
}

// پرسش‌های تکمیلیِ الگومحور برای افزایش تنوع تمرین و آزمون در هر دو فصل
(function addExtraQuestionBank(){
  const extras = [];
  const F = n => toFa(String(n));
  const add = (id,ch,topic,question,answer,wrong,hint,explanation,diff='medium') => {
    const vals = [...new Set([answer,...wrong])];
    let k=1;
    while(vals.length<4) vals.push(F(13 + vals.length*7 + k++));
    extras.push({
      id, chapter:ch, topic, type:'mcq', difficulty:diff, question,
      options:shuffle(vals).slice(0,4), answer,
      hint, explanation, steps:[explanation],
      visual:{kind:'rule_box',title:topic,formula:answer},
      source:'بانک تمرین تکمیلی', page:null,
      points:diff==='easy'?10:(diff==='hard'?30:20)
    });
  };
  const addPairs = (prefix,topic,pairs,op,calc,hintFn) => pairs.forEach(([a,b],i)=>{
    const ans=calc(a,b);
    add(`${prefix}-${String(i+1).padStart(3,'0')}`,2,topic,
      `حاصل عبارت (${F(a)}) ${op} (${F(b)}) کدام است؟`,F(ans),
      [F(ans+2),F(ans-2),F(-ans)],
      (typeof hintFn === 'function' ? hintFn(a,b) : hintFn),`(${F(a)}) ${op} (${F(b)}) = ${F(ans)}.`,i%3===0?'easy':'medium');
  });
  addPairs('C2-ADD','جمع اعداد صحیح',[[-8,5],[-6,-7],[9,-4],[-3,11],[7,-12],[-9,2],[4,-10],[-5,-5],[12,-8],[-11,6]],'+',(a,b)=>a+b,
    'اگر علامت‌ها متفاوت‌اند، مقدارها را کم و علامت عدد بزرگ‌تر را حفظ کنید؛ اگر هم‌علامت‌اند، مقدارها را جمع کنید.');
  addPairs('C2-SUB','تفریق اعداد صحیح',[[5,12],[-4,7],[8,-6],[-9,-3],[2,11],[-7,5],[10,14],[-3,-8],[6,-13],[-12,4]],'−',(a,b)=>a-b,
    'تفریق را به جمع قرینه عدد دوم تبدیل کنید.');
  addPairs('C2-MUL','ضرب اعداد صحیح',[[-3,5],[-4,-6],[7,-2],[8,3],[-9,-2],[6,-5],[4,-7],[3,8]],'×',(a,b)=>a*b,
    'ابتدا مقدارها را ضرب کنید؛ هم‌علامت حاصل مثبت و ناهم‌علامت حاصل منفی دارد.');
  addPairs('C2-DIV','تقسیم اعداد صحیح',[[-24,6],[35,-5],[-42,-7],[56,8],[-36,4],[45,-9],[64,-8],[-72,-9]],'÷',(a,b)=>a/b,
    'ابتدا مقدارها را تقسیم کنید و سپس با توجه به علامت‌ها پاسخ را تعیین کنید.');

      `اگر x = ${F(x)} باشد، مقدار عبارت ${F(a)}x + ${F(b)} کدام است؟`,

      'عدد داده‌شده را به جای x قرار دهید؛ ابتدا ضرب و سپس جمع را انجام دهید.',
      `${F(a)} × ${F(x)} + ${F(b)} = ${F(a*x)} + ${F(b)} = ${F(ans)}.`);

  for(let i=1;i<=12;i++){

    ['C2-XD-005',2,'تقسیم اعداد صحیح','حاصل (۴۸-) ÷ (۶+) را محاسبه و علامت پاسخ را مشخص کنید.','۸-','۴۸ ÷ ۶ = ۸ و چون علامت‌ها مخالف‌اند، پاسخ ۸- است.'],
    ['C2-XD-006',2,'کاربرد اعداد صحیح','دمای هوا ۲ درجه زیر صفر است و سپس ۷ درجه افزایش می‌یابد. دمای جدید را بنویسید.','۵+ درجه','دمای آغازین ۲- است؛ ۲- + ۷+ = ۵+ درجه.'],
    ['C3-XD-001',3,'عبارت جبری','عبارت «۵ واحد کمتر از سه برابر یک عدد» را به صورت جبری بنویسید.','۳x − ۵','سه برابر عدد ۳x است و پنج واحد کمتر از آن یعنی ۳x − ۵.'],
    ['C3-XD-002',3,'جمله‌های متشابه','عبارت ۴a + ۳b − a + ۲b را ساده کنید.','۳a + ۵b','جمله‌های aدار: ۴a − a = ۳a؛ جمله‌های bدار: ۳b + ۲b = ۵b.'],
    ['C3-XD-003',3,'محیط و مساحت با عبارت جبری','محیط مربعی با ضلع x را به صورت عبارت جبری بنویسید.','۴x','مربع چهار ضلع مساوی دارد؛ بنابراین محیط برابر x + x + x + x = ۴x است.'],
    ['C3-XD-004',3,'الگوهای عددی','در الگوی ۳، ۶، ۹، ۱۲، ... جمله دهم را پیدا کنید.','۳۰','جمله nام برابر ۳n است؛ برای n = ۱۰ داریم ۳ × ۱۰ = ۳۰.'],
    ['C3-XD-005',3,'مقدار عددی عبارت جبری','اگر a = ۴ باشد، مقدار ۲a + ۳ را محاسبه کنید.','۱۱','به جای a عدد ۴ قرار می‌دهیم: ۲ × ۴ + ۳ = ۸ + ۳ = ۱۱.'],
    ['C3-XD-006',3,'معادله','معادله x + ۷ = ۱۵ را حل کنید و روش را بنویسید.','x = ۸','از دو طرف ۷ کم می‌کنیم: x = ۱۵ − ۷ = ۸.']
  ];
  desc.forEach(([id,chapter,topic,question,answer,explanation],i)=>extras.push({
    id,chapter,topic,type:'descriptive',difficulty:i%3===0?'easy':'medium',
    question,answer,hint:'ابتدا قانون یا رابطه مربوط به این مبحث را مشخص کنید و سپس مرحله‌به‌مرحله حل کنید.',
    explanation,steps:[explanation],visual:{kind:'rule_box',title:topic,formula:answer},
    source:'بانک تشریحی تکمیلی',page:null,points:i%3===0?10:20
  }));


  // بانک متنوع و پارامتریک فصل دوم: قرینه، مقایسه، محور، و جمع/تفریق سه عدد دورقمی
  const addRich = (id, topic, question, answer, wrong, hint, explanation, steps, visual, difficulty='medium') => {
    const opts = [...new Set([answer, ...wrong])];
    while (opts.length < 4) opts.push(F(17 + opts.length * 9));
    extras.push({
      id, chapter: 2, topic, type: 'mcq', difficulty, question,
      options: shuffle(opts).slice(0,4), answer, hint, explanation, steps,
      visual, source: 'بانک تمرین تکمیلی متنوع', page: null,
      points: difficulty === 'easy' ? 10 : difficulty === 'hard' ? 30 : 20
    });
  };
  const signed = n => n > 0 ? `+${F(n)}` : n < 0 ? `−${F(Math.abs(n))}` : '۰';
  const paren = n => n < 0 ? `(−${F(Math.abs(n))})` : `(+${F(n)})`;

  // قرینه: ۳۰ سؤال با اعداد مثبت، منفی، صفر و نمایش‌های متنوع
  for (let i=1; i<=30; i++) {
    const n = i===30 ? 0 : (i%2 ? (i%10+1) : -(i%10+1));
    const ans = -n;
    const wrong = [n, ans+2, ans-3].filter(v=>v!==ans).map(signed);
    addRich(`C2-OPP-${String(i).padStart(3,'0')}`, 'قرینه اعداد صحیح',
      `قرینه عدد ${signed(n)} کدام است؟`, signed(ans), wrong,
      'قرینه هر عدد، همان فاصله را در طرف مقابل صفر دارد؛ علامت عوض می‌شود و قرینه صفر خود صفر است.',
      `قرینه ${signed(n)} برابر ${signed(ans)} است؛ زیرا مجموع این دو عدد صفر می‌شود.`,
      [`عدد ${signed(n)} را در نظر می‌گیریم.`,`قرینه در سوی دیگر صفر و با همان فاصله قرار می‌گیرد: ${signed(ans)}.`,`بررسی: ${signed(n)} + (${signed(ans)}) = ۰.`],
      {kind:'numberline', title:`قرینه ${signed(n)} روی محور`, points:[{val:Math.max(-10,Math.min(10,n)),label:signed(n)},{val:0,label:'۰'},{val:Math.max(-10,Math.min(10,ans)),label:signed(ans)}]},
      i%4===0?'easy':'medium');
  }

  // مقایسه: جفت‌های مثبت، منفی، صفر و اعداد هم‌قدر با علامت مخالف
  for (let i=1; i<=36; i++) {
    let a, b;
    switch(i%6) {
      case 0: a=-(i%10+1); b=-(i%7+1); break;
      case 1: a=i%10+1; b=-(i%9+1); break;
      case 2: a=-(i%9+1); b=0; break;
      case 3: a=i%8+1; b=i%8+2; break;
      case 4: a=-(i%7+2); b=-(i%5+1); break;
      default: a=i%9+1; b=-(i%9+1);
    }
    const answer = a>b ? `${signed(a)} > ${signed(b)}` : a<b ? `${signed(a)} < ${signed(b)}` : `${signed(a)} = ${signed(b)}`;
    const wrong = [a>b?`${signed(b)} > ${signed(a)}`:`${signed(a)} > ${signed(b)}`,
      a===b?`${signed(a)} < ${signed(b)}`:`${signed(a)} = ${signed(b)}`,
      `${signed(b)} < ${signed(a)}`].filter(x=>x!==answer);
    addRich(`C2-CMP-${String(i).padStart(3,'0')}`, 'مقایسه اعداد صحیح',
      `علامت مناسب ( < ، > یا = ) را انتخاب کنید: ${signed(a)}  □  ${signed(b)}`,
      answer, wrong,
      'روی محور اعداد، هر عددی که راست‌تر باشد بزرگ‌تر است. بین دو عدد منفی، عددی که قدرمطلق کوچک‌تری دارد بزرگ‌تر است.',
      `${answer}؛ چون جایگاه این دو عدد روی محور به همین ترتیب است.`,
      [`ابتدا جایگاه دو عدد را نسبت به صفر مشخص می‌کنیم.`,`عدد راست‌تر بزرگ‌تر است؛ بنابراین ${answer}.`],
      {kind:'numberline',title:`مقایسه ${signed(a)} و ${signed(b)} روی محور`,points:[{val:Math.max(-10,Math.min(10,a)),label:signed(a)},{val:0,label:'۰'},{val:Math.max(-10,Math.min(10,b)),label:signed(b)}]},
      i%3===0?'easy':'medium');
  }

  // جمع و تفریق دو عدد با حرکت گام‌به‌گام روی همان محور انیمیشنی موجود
  for (let i=1; i<=32; i++) {
    let a = (i*3)%11-5, b = (i*5)%11-5;
    if (a===0) a=4; if (b===0) b=-3;
    const isSub = i%2===0;
    const movement = isSub ? -b : b;
    const result = a + movement;
    const topic = isSub ? 'تفریق اعداد صحیح' : 'جمع اعداد صحیح';
    const op = isSub ? ' − ' : ' + ';
    const answer = signed(result);
    const converted = isSub ? `${paren(a)} − ${paren(b)} = ${paren(a)} + ${paren(-b)}` : `${paren(a)} + ${paren(b)}`;
    addRich(`C2-AXIS-${String(i).padStart(3,'0')}`, topic,
      `حاصل ${paren(a)} ${op} ${paren(b)} با کمک محور اعداد کدام است؟`,
      answer, [signed(result+2),signed(result-2),signed(-result)],
      isSub ? 'تفریق را به جمع قرینه عدد دوم تبدیل کنید؛ سپس از صفر به عدد اول و از آنجا به اندازه عدد دومِ تبدیل‌شده حرکت کنید.' : 'از صفر به اندازه عدد اول حرکت کنید؛ سپس از نقطه پایان، به اندازه عدد دوم و در جهت علامت آن حرکت کنید.',
      `${converted} = ${answer}.`,
      isSub ? [`تبدیل تفریق به جمع قرینه: ${converted}.`,`حرکت اول: از صفر تا ${signed(a)}.`,`حرکت دوم: به اندازه ${signed(-b)} حرکت می‌کنیم و به ${answer} می‌رسیم.`] : [`حرکت اول: از صفر تا ${signed(a)}.`,`حرکت دوم: از ${signed(a)} به اندازه ${signed(b)} حرکت می‌کنیم.`,`نقطه پایان ${answer} است.`],
      {kind:'move_line',title:`نمایش گام‌به‌گام ${converted} = ${answer}`,first:a,second:movement,end:result},
      i%4===0?'easy':'medium');
  }

  // سه عدد صحیح دورقمی با علامت‌های مثبت و منفی؛ جدول دهگان/یکان و شرح حل
  for (let i=1; i<=48; i++) {
    const raw = [
      10 + ((i*7)%39),
      10 + ((i*11+5)%39),
      10 + ((i*13+9)%39)
    ];
    const nums = raw.map((n,j) => ((i+j*2)%3===0 ? -n : n));
    const isSub = i%2===0;
    const terms = isSub ? [nums[0], -nums[1], nums[2]] : nums;
    const result = terms.reduce((a,b)=>a+b,0);
    const expr = isSub ? `${paren(nums[0])} − ${paren(nums[1])} + ${paren(nums[2])}` : nums.map(paren).join(' + ');
    const shownTerms = terms.map(paren).join(' + ');
    const topic = isSub ? 'تفریق اعداد صحیح' : 'جمع اعداد صحیح';
    const answer = signed(result);
    const positiveTotal = terms.filter(n=>n>0).reduce((a,b)=>a+b,0);
    const negativeMagnitude = -terms.filter(n=>n<0).reduce((a,b)=>a+b,0);
    const explanation = `${expr} = ${shownTerms}. مجموع عددهای مثبت: ${signed(positiveTotal)}؛ مجموع قدرمطلق عددهای منفی: ${F(negativeMagnitude)}. بنابراین ${F(positiveTotal)} − ${F(negativeMagnitude)} = ${answer}.`;
    addRich(`C2-COL-${String(i).padStart(3,'0')}`,topic,
      `حاصل عبارت سه‌عددی ${expr} کدام است؟`,
      answer,[signed(result+10),signed(result-10),signed(-result)],
      'برای حل، عددها را در جدول دهگان و یکان بررسی کنید. در تفریق، ابتدا آن را به جمع قرینه تبدیل کنید؛ سپس مجموع مثبت‌ها و قدرمطلق مجموع منفی‌ها را جداگانه به دست آورید.',
      explanation,
      [`در جدول، دهگان و یکان هر عدد را مشخص می‌کنیم؛ میله‌ها دهگان و دایره‌ها یکان را نشان می‌دهند.`,`تبدیل عبارت به جمع: ${shownTerms}.`,`مجموع عددهای مثبت برابر ${F(positiveTotal)} است.`,`مجموع قدرمطلق عددهای منفی برابر ${F(negativeMagnitude)} است.`,`تفاضل دو مجموع با علامت مناسب: ${F(positiveTotal)} − ${F(negativeMagnitude)} = ${answer}.`],
      {kind:'signed_columns',title:'جدول ارزش مکانی دهگان و یکانِ سه عدد صحیح',operands:terms},
      i%4===0?'hard':'medium');
  }

  const ids=new Set(questionBank.questions.map(q=>q.id));
  extras.forEach(q=>{if(!ids.has(q.id)) questionBank.questions.push(q);});
  saveQuestionBank();
})();

// انتخاب تصادفی خودکار بدون تکرار هنگام ورود مجدد به هر بخش
let recentlyShownIds = [];
function pickRandomNonRepeating(pool, count) {
  const fresh = pool.filter(q => !recentlyShownIds.includes(q.id));
  const secondary = pool.filter(q => recentlyShownIds.includes(q.id));
  const combined = [...shuffle(fresh), ...shuffle(secondary)].slice(0, Math.min(count, pool.length));
  combined.forEach(q => {
    recentlyShownIds.push(q.id);
    if (recentlyShownIds.length > 22) recentlyShownIds.shift();
  });
  return combined;
}

function playTone(type) {
  if (!progress.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'ok') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.09);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    } else {
      osc.frequency.setValueAtTime(240, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }
  } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const m2Done = ['M2-1','M2-2','M2-3'].every(id => progress.completedMissions.includes(id));

function launchConfiguredQuiz(isCustom) {
  const ch = document.getElementById('cfgChapter').value;
  const topic = document.getElementById('cfgTopic').value;
  const diff = document.getElementById('cfgDiff').value;
  const count = Number(document.getElementById('cfgCount').value);
  const timed = document.getElementById('cfgTimed').value === 'yes';
  const qType = isCustom ? document.getElementById('cfgType').value : 'mcq';

  let pool = questionBank.questions.filter(q => {
    if (ch !== 'all' && String(q.chapter) !== ch) return false;
    if (topic !== 'all' && q.topic !== topic) return false;
    if (diff !== 'all' && q.difficulty !== diff) return false;
    if (qType === 'mcq' && q.type !== 'mcq') return false;
    if (qType === 'descriptive' && q.type !== 'descriptive') return false;
    return true;
  });

  if (pool.length === 0) {
    alert('با فیلترهای انتخاب‌شده سؤالی یافت نشد! تنظیمات را گسترده‌تر کنید.');
    return;
  }

  const selected = pickRandomNonRepeating(pool, Math.min(count, pool.length));
  startQuizSession({
    title: isCustom ? 'آزمون اختصاصی دانش‌آموز' : 'مسابقه چهارگزینه‌ای',
    questions: selected,
    timed,
    timeLimitSec: timed ? selected.length * 60 : 0
  });
}

function startTeacherExam(idx) {
  const ex = customExams[idx];
  const qs = ex.questionIds.map(id => questionBank.questions.find(q => q.id === id)).filter(Boolean);
  startQuizSession({ title: ex.title, questions: qs, timed: ex.duration > 0, timeLimitSec: ex.duration * 60 });
}

function updateMpPlayerInputs(cnt) {
  const existing = [...document.querySelectorAll('.mp-name-input')].map(i => i.value);
  const avs = ['🦄', '🦁', '🐼', '🚀'];
  mpState.players = Array.from({ length: cnt }, (_, i) => ({
    name: existing[i] || `بازیکن ${toFa(i + 1)}`,
    avatar: avs[i % avs.length],
    score: 0,
    correct: 0
  }));
  render();
}

function startMultiplayerMatch() {
  const nameInputs = [...document.querySelectorAll('.mp-name-input')];
  mpState.players = nameInputs.map((inp, i) => ({
    name: inp.value.trim() || `بازیکن ${toFa(i + 1)}`,
    avatar: mpState.players[i]?.avatar || '🦊',
    score: 0,
    correct: 0
  }));
  const ch = document.getElementById('mpCh').value;
  const qCount = Number(document.getElementById('mpQCount').value);
  const pool = questionBank.questions.filter(q => q.type === 'mcq' && (ch === 'all' || String(q.chapter) === ch));
  mpState.questions = pickRandomNonRepeating(pool, Math.min(qCount, pool.length));
  mpState.qIndex = 0;
  mpState.turnIdx = 0;
  mpState.lastFeedback = '';
  mpState.phase = 'playing';
  render();
}

function submitMpAnswer(chosen) {
  const q = mpState.questions[mpState.qIndex];
  const p = mpState.players[mpState.turnIdx];
  const ok = chosen === q.answer;
  if (ok) {
    p.score += q.points;
    p.correct += 1;
    playTone('ok');
    mpState.lastFeedback = `✅ ${p.name} درست پاسخ داد (+${toFa(q.points)} امتیاز)! ${formatMathText(q.explanation)}`;
  } else {
    playTone('err');
    mpState.lastFeedback = `❌ پاسخ ${p.name} نادرست بود. پاسخ صحیح: ${formatMathText(q.answer)} — ${formatMathText(q.explanation)}`;
  }

  mpState.turnIdx = (mpState.turnIdx + 1) % mpState.players.length;
  if (mpState.qIndex + 1 < mpState.questions.length) {
    mpState.qIndex++;
    render();
  } else {
    mpState.phase = 'finished';
    render();
  }
}

};

function setupTempStage(st) {
  gameState.tempStage = st;
  gameState.tempMsg = '';
  if (st === 1) {
    const arr = [-5, -3, -2, 3, 4, 6];
    gameState.tempTarget = arr[Math.floor(Math.random() * arr.length)];
    gameState.tempCurrent = 0;
    gameState.tempMovesLeft = 5;
  } else if (st === 2) {
    const starts = [-4, 2, -2, 5];
    const targets = [-9, -6, 7, 8];
    gameState.tempCurrent = starts[Math.floor(Math.random() * starts.length)];
    gameState.tempTarget = targets[Math.floor(Math.random() * targets.length)];
    if (gameState.tempCurrent === gameState.tempTarget) gameState.tempTarget -= 4;
    gameState.tempMovesLeft = 4;
  } else {
    const starts = [-7, 6, -8, 9];
    const targets = [5, -6, 4, -5];
    gameState.tempCurrent = starts[Math.floor(Math.random() * starts.length)];
    gameState.tempTarget = targets[Math.floor(Math.random() * targets.length)];
    gameState.tempMovesLeft = 3;
  }
}

function setupAlgStage(st) {
  gameState.algStage = st;
  gameState.algMsg = '';
  const stagesBank = {
    1: [
      { expr: '-(+(-۷))', ans: '+۷', opts: ['+۷', '-۷', '۰', '-۱۴'] },
      { expr: '-(-(-۵))', ans: '-۵', opts: ['-۵', '+۵', '۰', '-۱۵'] },
      { expr: '۳x + ۲x', ans: '۵x', opts: ['۵x', '۶x', 'x', '۵'] },
      { expr: '۷a - ۳a', ans: '۴a', opts: ['۴a', '۱۰a', '۴', '-۴a'] }
    ],
    2: [
      { expr: '۵a + ۳b - ۲a + b', ans: '۳a + ۴b', opts: ['۳a + ۴b', '۷a + ۲b', '۳a + ۲b', '۸ab'] },
      { expr: '۴(x + ۲)', ans: '۴x + ۸', opts: ['۴x + ۸', '۴x + ۲', 'x + ۸', '۴x + ۶'] },
      { expr: '-(۳x - ۵y)', ans: '-۳x + ۵y', opts: ['-۳x + ۵y', '-۳x - ۵y', '۳x + ۵y', '-۳x + ۱۵y'] }
    ],
    3: [
      { expr: '۳(۲x - ۱) + ۲x', ans: '۸x - ۳', opts: ['۸x - ۳', '۶x - ۱', '۸x - ۱', '۵x - ۳'] },
      { expr: '(۳x - ۸) - (۳x + ۷)', ans: '-۱۵', opts: ['-۱۵', '-۱', '۶x - ۱۵', '+۱۵'] },
      { expr: '۲(y + x) - (x - y)', ans: 'x + ۳y', opts: ['x + ۳y', 'x + y', '۳x + y', 'x - ۳y'] }
    ]
  };
  const list = stagesBank[st];
  const pick = list[Math.floor(Math.random() * list.length)];
  gameState.algExpr = pick.expr;
  gameState.algTarget = pick.ans;
  gameState.algOptions = shuffle(pick.opts);
}

function setupEqStage(st) {
  gameState.eqStage = st;
  gameState.eqMsg = '';
  if (st === 1) {
    const x = Math.floor(Math.random() * 6) + 2;
    const b = Math.floor(Math.random() * 7) + 1;
    gameState.eqX = x;
    gameState.eqText = `x + ${toFa(b)} = ${toFa(x + b)}`;
    gameState.eqHint = `از دو طرف عدد ${toFa(b)} را کم کن.`;
  } else if (st === 2) {
    const a = Math.floor(Math.random() * 3) + 2;
    const x = Math.floor(Math.random() * 5) + 2;
    const b = Math.floor(Math.random() * 5) + 1;
    gameState.eqX = x;
    gameState.eqText = `${toFa(a)}x - ${toFa(b)} = ${toFa(a * x - b)}`;
    gameState.eqHint = `ابتدا ${toFa(b)} را به دو طرف اضافه کن، سپس بر ${toFa(a)} تقسیم کن.`;
  } else {
    const x = Math.floor(Math.random() * 4) + 2;
    const c = Math.floor(Math.random() * 4) + 1;
    gameState.eqX = x;
    gameState.eqText = `۳x - ${toFa(c)} = x + ${toFa(2 * x - c)}`;
    gameState.eqHint = `ابتدا از دو طرف معادله x کم کن تا ۲x - ${toFa(c)} = ${toFa(2 * x - c)} شود.`;
  }
}

function adjustTemp(delta) {
  if (gameState.tempMovesLeft <= 0 && gameState.tempCurrent !== gameState.tempTarget) {
    setupTempStage(gameState.tempStage);
    render();
    return;
  }
  gameState.tempCurrent += delta;
  gameState.tempMovesLeft--;
  if (gameState.tempCurrent === gameState.tempTarget) {
    gameState.combo++;
    const bonus = 10 + gameState.tempStage * 5 + Math.min(15, gameState.combo * 2);
    progress.points += bonus;
    progress.stars += 1;
    saveProgress();
    playTone('ok');
    const nextSt = Math.min(3, gameState.tempStage + 1);
    gameState.tempMsg = `🎉 شاهکار! دقیقاً به دمای هدف رسیدی (+${toFa(bonus)} امتیاز)! آماده مرحله ${toFa(nextSt)} هستی؟ <button class="btn btn-primary btn-sm" style="margin-right:8px;" onclick="setupTempStage(${nextSt}); render();">مرحله بعد ⬅️</button>`;
  } else if (gameState.tempMovesLeft <= 0) {
    gameState.combo = 0;
    playTone('err');
    gameState.tempMsg = `⏰ حرکت‌های این دور تمام شد! دوباره تلاش کن: <button class="btn btn-warning btn-sm" onclick="setupTempStage(gameState.tempStage); render();">تلاش مجدد</button>`;
  } else {
    gameState.tempMsg = `ادامه بده! فاصله تا هدف: ${toFa(Math.abs(gameState.tempTarget - gameState.tempCurrent))} درجه`;
  }
  render();
}

function checkAlgGame(opt) {
  if (opt === gameState.algTarget) {
    gameState.combo++;
    const bonus = 10 + gameState.algStage * 5;
    progress.points += bonus;
    progress.stars += 1;
    saveProgress();
    playTone('ok');
    const nextSt = Math.min(3, gameState.algStage + 1);
    gameState.algMsg = `🎉 آفرین! <span class="math" dir="ltr">${toFa(gameState.algExpr)} = ${toFa(gameState.algTarget)}</span> (+${toFa(bonus)} امتیاز) <button class="btn btn-primary btn-sm" style="margin-right:8px;" onclick="setupAlgStage(${nextSt}); render();">چالش بعدی ⬅️</button>`;
  } else {
    gameState.combo = 0;
    playTone('err');
    gameState.algMsg = `❌ نادرست بود! به علامت قرینه پشت پرانتز و جمله‌های متشابه دقت کن.`;
  }
  render();
}

function checkEqGame() {
  const val = Number(document.getElementById('eqGuess').value);
  if (val === gameState.eqX) {
    gameState.combo++;
    const bonus = 12 + gameState.eqStage * 6;
    progress.points += bonus;
    progress.stars += 1;
    saveProgress();
    playTone('ok');
    const nextSt = Math.min(3, gameState.eqStage + 1);
    gameState.eqMsg = `🎉 عالی بود! جواب معادله <span class="math" dir="ltr">x = ${toFa(gameState.eqX)}</span> است (+${toFa(bonus)} امتیاز) <button class="btn btn-primary btn-sm" style="margin-right:8px;" onclick="setupEqStage(${nextSt}); render();">مرحله بعد ⬅️</button>`;
  } else {
    gameState.combo = 0;
    playTone('err');
    gameState.eqMsg = `❌ راهنمایی: ${gameState.eqHint}`;
  }
  render();
}

let practiceState = { chapter: 'all', topic: 'all', pool: [], index: 0, showHint: false, showSteps: false, sessionSeed: 0 };

function buildPracticePool(force = false) {
  const topics = getTopicsByChapter(practiceState.chapter);
  const signature = `${practiceState.chapter}|${practiceState.topic}|${questionBank.questions.length}`;
  if (force || practiceState.poolSignature !== signature || !practiceState.pool.length) {
    const filtered = questionBank.questions.filter(q => {
      if (practiceState.chapter !== 'all' && String(q.chapter) !== practiceState.chapter) return false;
      if (practiceState.topic !== 'all' && q.topic !== practiceState.topic) return false;
      return true;
    });
    practiceState.pool = pickRandomNonRepeating(filtered, filtered.length);
    practiceState.poolSignature = signature;
    practiceState.index = 0;
    practiceState.showHint = false;
    practiceState.showSteps = false;
  }
  return topics;
}

function getWorkedSteps(q) {
  const source = q.steps || [q.explanation || ''];
  if (!q.topic || !String(q.topic).includes('معادله')) return source;
  const result = source.map(step => {
    const t = String(step);
    let m = t.match(/(?:کم کردن|کم می‌کنیم|کم کنید)\s+([0-9۰-۹]+)/);
    if (m) return `عدد مثبتِ ${m[1]} که کنار عبارت مجهول است، به طرف دیگر مساوی منتقل می‌شود؛ چون از طرف چپ به طرف راست می‌رود، عمل جمع به تفریق تبدیل می‌شود. ${t}`;
    m = t.match(/(?:جمع|اضافه کردن|اضافه می‌کنیم|اضافه کنید)\s+([0-9۰-۹]+)/);
    if (m) return `عدد منفیِ ${m[1]} که کنار عبارت مجهول است، به طرف دیگر مساوی منتقل می‌شود؛ عمل تفریق به جمع تبدیل می‌شود. ${t}`;
    return t;
  });
  const transferRule = 'پس از تشکیل معادله، اگر عدد ثابتی کنار عبارت مجهول باشد، آن را به طرف دیگر مساوی می‌بریم؛ هنگام انتقال، جمع به تفریق و تفریق به جمع تبدیل می‌شود. اگر مجهول در هر دو طرف باشد، جمله‌های مجهول را یک طرف و عددهای ثابت را طرف دیگر جمع می‌کنیم. در پایان، ضریب مجهول را با تقسیم حذف می‌کنیم تا مقدار مجهول به دست آید.';
  const formationIndex = result.findIndex(x => /تشکیل معادله|نوشتن معادله|انتخاب مجهول|تعداد .* را x بگیرید|قیمت .* را x بگیرید/.test(x));
  result.splice(formationIndex >= 0 ? formationIndex + 1 : 0, 0, transferRule);
  return result;
}

let quizState = null;
let quizTimerInterval = null;

function startQuizSession(cfg) {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  quizState = {
    title: cfg.title,
    questions: cfg.questions,
    index: 0,
    selectedOption: null,
    descDraft: '',
    submittedCurrent: false,
    answers: [],
    startTime: Date.now(),
    qStartTime: Date.now(),
    timed: cfg.timed || false,
    remainingSec: cfg.timeLimitSec || 0,
    missionId: cfg.missionId || null
  };

  if (quizState.timed) {
    quizTimerInterval = setInterval(() => {
      if (!quizState) return;
      quizState.remainingSec--;
      const el = document.getElementById('quizTimerDisplay');
      if (el) el.textContent = formatSeconds(quizState.remainingSec);
      if (quizState.remainingSec <= 0) {
        clearInterval(quizTimerInterval);
        finishQuizSession();
      }
    }, 1000);
  }
  navigate('quizRun');
}

function formatSeconds(sec) {
  const s = Math.max(0, sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return toFa(`${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`);
}

function renderQuizRun() {
  if (!quizState) return renderHome();
  const q = quizState.questions[quizState.index];
  const total = quizState.questions.length;
  const pct = Math.round(((quizState.index + (quizState.submittedCurrent ? 1 : 0)) / total) * 100);

    <div class="section-header">

        <button class="btn btn-danger btn-sm" onclick="finishQuizSession()">پایان آزمون</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div>
          <strong>سؤال ${toFa(quizState.index + 1)} از ${toFa(total)}</strong>

function selectQuizOption(idx) {
  if (!quizState || quizState.submittedCurrent) return;

function submitQuizAnswer() {
  if (!quizState || quizState.submittedCurrent) return;
  const q = quizState.questions[quizState.index];
  const timeTaken = Math.max(1, Math.round((Date.now() - quizState.qStartTime) / 1000));

  if (q.type === 'mcq') {
    if (!quizState.selectedOption) { alert('لطفاً ابتدا یکی از گزینه‌ها را انتخاب کن!'); return; }
    const isCorrect = quizState.selectedOption === q.answer;
    let earned = 0;
    if (isCorrect) {
      const speedBonus = timeTaken <= 15 ? 5 : (timeTaken <= 25 ? 2 : 0);
      earned = q.points + speedBonus;
      progress.points += earned;
      progress.stars += 1;
      playTone('ok');
      setMascot(`عالی بود! ${toFa(earned)} امتیاز گرفتی ${speedBonus > 0 ? '(با پاداش سرعت!)' : ''}`);
    } else {
      playTone('err');
      setMascot('به محور گام‌به‌گام و راه‌حل پایین نگاه کن تا این نکته در ذهنت ماندگار شود.');
    }

    if (!progress.topicStats[q.topic]) progress.topicStats[q.topic] = { correct: 0, wrong: 0, chapter: q.chapter };
    if (isCorrect) progress.topicStats[q.topic].correct++;
    else progress.topicStats[q.topic].wrong++;

    quizState.answers.push({ qId: q.id, chapter: q.chapter, topic: q.topic, type: 'mcq', userAns: quizState.selectedOption, isCorrect, pointsEarned: earned, timeTaken });
  } else {
    const txt = document.getElementById('quizDescInput').value.trim();
    if (!txt) { alert('لطفاً پاسخ تشریحی خود را بنویس.'); return; }
    quizState.descDraft = txt;
    descAnswers[descAnswerKey(q.id)] = { questionId:q.id, studentId:progress.id, studentName:progress.studentName, gradeClass:progress.gradeClass || 'هفتم', answerText: txt, status: 'نیازمند بررسی معلم', teacherFeedback:'', updatedAt: toFa(new Date().toLocaleDateString('fa-IR')) };
    saveDescAnswers();
    quizState.answers.push({ qId: q.id, chapter: q.chapter, topic: q.topic, type: 'descriptive', userAns: txt, isCorrect: null, needsTeacherReview: true, pointsEarned: 0, timeTaken });
    setMascot('پاسخ تشریحی تو با وضعیت «نیازمند بررسی معلم» ذخیره شد.');
  }

  quizState.submittedCurrent = true;
  saveProgress();
  render();
}

function nextQuizQuestion() {
  if (!quizState) return;
  if (quizState.index + 1 < quizState.questions.length) {
    quizState.index++;
    quizState.selectedOption = null;
    quizState.descDraft = '';
    quizState.submittedCurrent = false;
    quizState.qStartTime = Date.now();
    render();
  } else {
    finishQuizSession();
  }
}

function finishQuizSession() {
  if (quizTimerInterval) clearInterval(quizTimerInterval);
  if (!quizState) return;

  const total = quizState.questions.length;
  const mcqAnswers = quizState.answers.filter(a => a.type === 'mcq');
  const descPending = quizState.answers.filter(a => a.type === 'descriptive').length;
  const correct = mcqAnswers.filter(a => a.isCorrect).length;
  const wrong = mcqAnswers.filter(a => !a.isCorrect).length;
  const unanswered = total - quizState.answers.length;
  const durationSec = Math.max(1, Math.round((Date.now() - quizState.startTime) / 1000));
  const autoGradable = mcqAnswers.length;
  const successRate = autoGradable > 0 ? Math.round((correct / autoGradable) * 100) : 0;
  const score20 = autoGradable > 0 ? ((correct / autoGradable) * 20).toFixed(1) : 'نیازمند بررسی معلم';

  if (quizState.missionId && successRate >= 60) {
    if (!progress.completedMissions.includes(quizState.missionId)) {
      progress.completedMissions.push(quizState.missionId);
      progress.points += 20;
      progress.currentStage = Math.min(6, progress.completedMissions.length + 1);
    }
  }
  checkAndAwardBadges();
  saveProgress();

  const report = {
    id: 'RPT-' + Date.now(),
    studentName: progress.studentName,
    date: toFa(new Date().toLocaleDateString('fa-IR')),
    title: quizState.title,
    total, correct, wrong, unanswered, descPending, successRate, score20, durationSec,
    details: quizState.answers
  };
  reports.unshift(report);
  saveReports();
  quizState = null;
  navigate('report', { latestId: report.id });
}

function saveTeacherQuestion() {
  const ch = Number(document.getElementById('fCh').value);
  const topic = document.getElementById('fTopic').value.trim();
  const type = document.getElementById('fType').value;
  const difficulty = document.getElementById('fDiff').value;
  const page = Number(document.getElementById('fPage').value) || null;
  const question = toFa(document.getElementById('fQuestion').value.trim());
  const answer = toFa(document.getElementById('fAnswer').value.trim());
  const hint = toFa(document.getElementById('fHint').value.trim());
  const explanation = toFa(document.getElementById('fExplanation').value.trim());
  if (!topic || !question || !answer) { alert('مبحث، سؤال و پاسخ را کامل کنید.'); return; }
  const allTxt = `${question} ${answer} ${explanation}`;
  if (allTxt.includes('قدر مطلق') || allTxt.includes('قدرمطلق') || /[\^²³]/.test(allTxt)) {
    alert('مبحث قدر مطلق و سؤال‌های توان‌دار مجاز نیستند!');
    return;
  }
  const points = difficulty === 'easy' ? 10 : (difficulty === 'medium' ? 20 : 30);
  let options = [];
  if (type === 'mcq') {
    options = [0,1,2,3].map(i => toFa(document.getElementById('fOpt'+i).value.trim()));
    if (options.some(o => !o) || !options.includes(answer)) { alert('هر ۴ گزینه را پر کنید و پاسخ صحیح را دقیق وارد نمایید.'); return; }
  }
  const newObj = {
    id: editingQuestionId || `C${ch}-${type==='mcq'?'MC':'DQ'}-${String(questionBank.questions.length+1).padStart(3,'0')}`,
    chapter: ch, topic, type, difficulty, page, question, options, answer, hint, explanation,
    steps: explanation.split('\n').filter(Boolean),
    visual: { kind: 'rule_box', title: topic, formula: answer },
    source: 'افزوده‌شده توسط معلم', points, reviewStatus: 'تایید شده توسط معلم'
  };
  if (editingQuestionId) {
    const idx = questionBank.questions.findIndex(x => x.id === editingQuestionId);
    if (idx !== -1) questionBank.questions[idx] = newObj;
  } else questionBank.questions.push(newObj);
  saveQuestionBank();
  editingQuestionId = null;
  teacherTab = 'bank';
  render();
}

function exportQuestionBankJSON() {
  const blob = new Blob([JSON.stringify(questionBank, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'question-bank.json'; a.click();
  URL.revokeObjectURL(url);
}

function importQuestionBankJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d || !Array.isArray(d.questions)) throw new Error();
      questionBank = d; saveQuestionBank(); alert('بانک سؤال بارگذاری شد!'); render();
    } catch { alert('فایل معتبر نیست.'); }
  };
  reader.readAsText(file);
}

  const selected = pickRandomNonRepeating(pool, Math.min(count, pool.length));
  printableExamData = { title, duration, scoreEach, withKey, questions: selected };
  customExams.unshift({ title, duration, questionIds: selected.map(q => q.id) });

      <h3 style="margin-top:0">👥 پروفایل دانش‌آموزان ثبت‌شده (${toFa(profiles.length)} نفر)</h3>
      <table class="data-table" style="margin-bottom:16px;">
        <thead><tr><th>آواتار</th><th>نام دانش‌آموز</th><th>کلاس</th><th>امتیاز</th><th>ستاره</th><th>مأموریت‌ها</th></tr></thead>
        <tbody>${profiles.map(p => `<tr><td style="font-size:1.4rem">${p.avatar}</td><td><strong>${p.studentName}</strong></td><td>${p.gradeClass || 'هفتم'}</td><td>${toFa(p.points)}</td><td>${toFa(p.stars)}</td><td>${toFa(p.completedMissions.length)}</td></tr>`).join('')}</tbody>
      </table>
      <h3>📈 پاسخ‌های ثبت‌شده برای بررسی معلم</h3>
      ${entries.length ? entries.map(([key,ans]) => {
        const qid = ans.questionId || key.split('::').pop();
        const q = questionBank.questions.find(x => x.id === qid);
        const inputId = `teacher-feedback-${key.replace(/[^a-zA-Z0-9_-]/g,'_')}`;
        const safeKey = key.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return `<div class="feedback-box" style="margin-bottom:12px">
          <div><strong>دانش‌آموز:</strong> ${ans.studentName || 'پروفایل قدیمی'} <span class="badge badge-ch">${ans.gradeClass || ''}</span></div>
          <div style="margin-top:5px"><strong>سؤال:</strong> ${q ? formatMathText(q.question) : toFa(qid)}</div>
          <div style="margin:6px 0"><strong>پاسخ دانش‌آموز:</strong> ${formatMathText(ans.answerText || '')}</div>
          <div><span class="badge badge-medium">${ans.status || 'نیازمند بررسی معلم'}</span></div>
          <label class="field" style="margin-top:8px">بازخورد و توضیح معلم:
            <textarea id="${inputId}" rows="3" placeholder="نکته مثبت، اشتباه احتمالی و راهنمایی برای اصلاح پاسخ...">${ans.teacherFeedback || ''}</textarea>
          </label>
          <button class="btn btn-success btn-sm" onclick="saveTeacherFeedback('${safeKey}', '${inputId}')">ثبت بررسی توسط معلم</button>
        </div>`;
      }).join('') : '<p style="color:var(--muted)">هنوز پاسخی برای بررسی ثبت نشده است.</p>'}
    </div>`;
}

function saveTeacherFeedback(key, inputId) {
  const item = descAnswers[key];
  const field = document.getElementById(inputId);
  if (!item || !field) return;
  item.teacherFeedback = field.value.trim();
  item.status = 'بررسی و بازخورد معلم ثبت شد';
  item.reviewedAt = toFa(new Date().toLocaleDateString('fa-IR'));
  saveDescAnswers();
  alert('بازخورد معلم ثبت شد و در پروفایل همان دانش‌آموز نمایش داده می‌شود.');
  render();
}

// ==================== مستندات ====================
function renderDocs() {
  return `
    <div class="section-header">
      <h2>🌐 راهنمای انتشار آنلاین و مستندات مباحث</h2>
      <button class="btn btn-outline btn-sm" onclick="navigate('home')">بازگشت به خانه</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0">۱. نحوه قرار دادن بازی روی اینترنت و ارسال لینک به کاربران</h3>
      <p>چون این نرم‌افزار یک فایل وب مستقل است، می‌توانید بدون نیاز به سرور در چند دقیقه آن را آنلاین کنید:</p>
      <ol>
        <li><strong>GitHub Pages:</strong> یک مخزن (Repository) رایگان بسازید، فایل HTML را با نام <code>index.html</code> آپلود کنید و در بخش Settings ← Pages آن را فعال کنید.</li>
        <li><strong>Netlify Drop:</strong> وارد سایت <code>app.netlify.com/drop</code> شوید و فایل را بکشید و رها کنید تا بلافاصله لینک قابل اشتراک‌گذاری بگیرید.</li>
        <li><strong>Vercel:</strong> پروژه را در Vercel منتشر کنید تا لینک مستقیم و پرسرعت در اختیار دانش‌آموزان قرار گیرد.</li>
      </ol>
    </div>
  `;
}

function render() {
  renderTopBar();
  const app = document.getElementById('app');
  switch (currentRoute) {
    case 'adventure': app.innerHTML = renderAdventure(); break;
    case 'quizSetup': app.innerHTML = renderQuizSetup(false); break;
    case 'customExam': app.innerHTML = renderQuizSetup(true); break;
    case 'multiplayer': app.innerHTML = renderMultiplayer(); break;
    case 'miniGames': app.innerHTML = renderMiniGames(); break;
    case 'sampleExams': app.innerHTML = renderSampleExams(); break;
    case 'quizRun': app.innerHTML = renderQuizRun(); break;
    case 'practice': app.innerHTML = renderPractice(); break;
    case 'descriptive': app.innerHTML = renderDescriptive(); break;
    case 'report': app.innerHTML = renderReport(); break;
    case 'profile': app.innerHTML = renderProfile(); break;
    case 'teacher': app.innerHTML = renderTeacher(); break;
    case 'docs': app.innerHTML = renderDocs(); break;
    default: app.innerHTML = renderHome();
  }
}

render();
</script>
</body>
</html>
